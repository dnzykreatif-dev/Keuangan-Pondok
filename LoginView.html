<!-- Login Screen -->
<div x-show="!isLoggedIn" x-cloak class="flex items-center justify-center min-h-screen p-4 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary/20 via-surface to-surface">
    <div class="w-full max-w-md animate-in">
        <div class="glass p-10 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/20 rounded-full blur-3xl"></div>
            <div class="relative z-10">
                <div class="text-center mb-10">
                    <template x-if="settings.logo_url">
                        <img :src="settings.logo_url" class="w-20 h-20 object-contain mx-auto mb-4 rounded-xl shadow-lg border border-white/10">
                    </template>
                    <template x-if="!settings.logo_url">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-primary/10 rounded-2xl mb-4 border border-primary/20 shadow-[0_0_20px_rgba(12,92,171,0.3)]">
                            <i data-lucide="graduation-cap" class="w-8 h-8 text-primary"></i>
                        </div>
                    </template>
                    <h1 class="text-3xl font-bold tracking-tight text-white" x-text="settings.school_name || 'Login Admin'"></h1>
                    <p class="text-zinc-400 mt-2 text-sm">Sistem Administrasi Keuangan Pesantren</p>
                </div>
                <form @submit.prevent="handleLogin" class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold uppercase tracking-wider text-zinc-500 ml-1">Username</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
                            <input type="text" x-model="auth.username" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-xl pl-11 pr-4 py-3 text-sm focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all" placeholder="Masukkan username" required>
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold uppercase tracking-wider text-zinc-500 ml-1">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-zinc-500"></i>
                            <input type="password" x-model="auth.password" class="w-full bg-zinc-950/50 border border-zinc-800 rounded-xl pl-11 pr-4 py-3 text-sm focus:ring-2 focus:ring-primary/50 focus:border-primary outline-none transition-all" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-primary hover:bg-secondary text-white py-3.5 rounded-xl font-bold transition-all transform active:scale-[0.98] shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                        <span>Masuk ke Dashboard</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
