<!-- Login Screen -->
<div x-show="appReady && !isLoggedIn" x-cloak class="flex items-center justify-center min-h-screen p-4 bg-[radial-gradient(circle_at_top,_rgba(31,122,217,0.14),_transparent_38%),linear-gradient(180deg,#f9fbfe_0%,#e9f1f8_100%)]">
    <div class="w-full max-w-md animate-in">
        <div class="panel p-10 rounded-3xl relative overflow-hidden">
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-primary/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-24 -left-20 w-48 h-48 bg-success/10 rounded-full blur-3xl"></div>
            <div class="relative z-10">
                <div class="text-center mb-10">
                    <template x-if="settings.logo_url">
                        <img :src="settings.logo_url" class="w-20 h-20 object-contain mx-auto mb-4 rounded-xl shadow-lg border border-white/10">
                    </template>
                    <template x-if="!settings.logo_url">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-primary/10 rounded-2xl mb-4 border border-primary/20 shadow-[0_0_20px_rgba(31,122,217,0.22)]">
                            <i data-lucide="graduation-cap" class="w-8 h-8 text-primary"></i>
                        </div>
                    </template>
                    <h1 class="text-3xl font-semibold tracking-tight text-[#243041]" x-text="settings.school_name || 'Login Admin'"></h1>
                    <p class="text-slate-500 mt-2 text-sm">Sistem Administrasi Keuangan Pesantren</p>
                </div>
                <form @submit.prevent="handleLogin" class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 ml-1">Username</label>
                        <div class="relative">
                            <i data-lucide="user" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                            <input type="text" x-model="auth.username" class="w-full pl-11 pr-4 py-3 text-sm rounded-xl" placeholder="Masukkan username" required>
                        </div>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-xs font-semibold uppercase tracking-wider text-slate-500 ml-1">Password</label>
                        <div class="relative">
                            <i data-lucide="lock" class="absolute left-3.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
                            <input type="password" x-model="auth.password" class="w-full pl-11 pr-4 py-3 text-sm rounded-xl" placeholder="••••••••" required>
                        </div>
                    </div>
                    <button type="submit" class="w-full bg-primary hover:bg-secondary text-white py-3.5 rounded-xl font-bold transition-all transform active:scale-[0.98] shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
                        <span>Masuk ke Dashboard</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
