<div id="invoice-modal" x-show="showInvoiceModal" x-cloak class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[80] flex items-start sm:items-center justify-center p-3 sm:p-6 overflow-y-auto">
    <div class="w-full max-w-3xl my-auto">
        <div class="flex flex-wrap justify-end gap-2 mb-3 invoice-toolbar">
            <button @click="printInvoice()" class="bg-white text-slate-900 px-4 py-2 rounded-lg text-sm font-semibold shadow-lg">
                <i data-lucide="printer" class="w-4 h-4 inline-block mr-1"></i> Cetak / Simpan PDF
            </button>
            <button @click="shareInvoiceWhatsApp()" class="bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-lg">
                <i data-lucide="message-circle" class="w-4 h-4 inline-block mr-1"></i> WhatsApp
            </button>
            <button @click="shareInvoiceNative()" class="bg-sky-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-lg">
                <i data-lucide="share-2" class="w-4 h-4 inline-block mr-1"></i> Bagikan
            </button>
            <button @click="shareInvoiceEmail()" class="bg-white text-slate-900 px-4 py-2 rounded-lg text-sm font-semibold shadow-lg">
                <i data-lucide="mail" class="w-4 h-4 inline-block mr-1"></i> Email
            </button>
            <button @click="copyInvoiceSummary()" class="bg-white text-slate-900 px-4 py-2 rounded-lg text-sm font-semibold shadow-lg">
                <i data-lucide="copy" class="w-4 h-4 inline-block mr-1"></i> Salin
            </button>
            <button @click="closeInvoiceModal()" class="bg-white/15 text-white px-4 py-2 rounded-lg text-sm font-semibold">
                Tutup
            </button>
        </div>

        <article class="invoice-paper bg-white text-slate-900 rounded-2xl overflow-hidden shadow-2xl">
            <div class="h-2 bg-[#0d1b72]"></div>
            <div class="p-6 sm:p-10">
                <header class="flex items-start justify-between gap-6 pb-7 border-b-2 border-slate-900/10">
                    <div class="flex items-center gap-4 min-w-0">
                        <template x-if="invoiceData?.logo_url">
                            <img :src="invoiceData.logo_url" alt="Logo lembaga" class="w-20 h-20 object-contain rounded-xl">
                        </template>
                        <div class="min-w-0">
                            <p class="text-[10px] uppercase tracking-[0.28em] text-[#89950b] font-bold">Bukti Pembayaran SPP</p>
                            <h1 class="text-xl sm:text-2xl font-bold text-[#0d1b72] leading-tight mt-1" x-text="invoiceData?.institution_name"></h1>
                            <p class="text-xs text-slate-500 mt-1">Dokumen resmi penerimaan pembayaran pendidikan</p>
                        </div>
                    </div>
                    <div class="text-right shrink-0">
                        <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold">Invoice</p>
                        <p class="font-bold text-[#0d1b72] mt-1" x-text="invoiceData?.invoice_number"></p>
                        <span class="inline-flex mt-3 px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 text-[10px] font-bold tracking-widest" x-text="invoiceData?.status"></span>
                    </div>
                </header>

                <div class="grid sm:grid-cols-2 gap-6 py-7">
                    <div>
                        <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold mb-2">Diterima dari</p>
                        <p class="font-bold text-lg" x-text="invoiceData?.student_name"></p>
                        <p class="text-sm text-slate-500" x-text="'Kelas ' + (invoiceData?.student_class || '-')"></p>
                    </div>
                    <div class="sm:text-right">
                        <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-bold mb-2">Tanggal pembayaran</p>
                        <p class="font-semibold" x-text="formatDate(invoiceData?.issued_at)"></p>
                        <p class="text-sm text-slate-500" x-text="invoiceData?.payment_id"></p>
                    </div>
                </div>

                <div class="rounded-xl border border-slate-200 overflow-hidden">
                    <div class="grid grid-cols-[1fr_auto] gap-4 px-4 py-3 bg-slate-50 text-[10px] uppercase tracking-widest text-slate-500 font-bold">
                        <span>Rincian pembayaran</span><span>Nominal</span>
                    </div>
                    <div class="grid grid-cols-[1fr_auto] gap-4 px-4 py-5 items-center">
                        <div>
                            <p class="font-semibold" x-text="invoiceData?.description"></p>
                            <p class="text-xs text-slate-500 mt-1" x-text="'Tagihan ' + invoiceData?.billing_label + ' • ' + invoiceData?.method"></p>
                        </div>
                        <p class="text-lg font-bold text-[#0d1b72]" x-text="formatCurrency(invoiceData?.amount)"></p>
                    </div>
                </div>

                <div class="flex justify-end pt-6">
                    <div class="w-full sm:w-80 space-y-2 text-sm">
                        <div class="flex justify-between text-slate-500"><span>Total tagihan</span><span x-text="formatCurrency(invoiceData?.total_amount)"></span></div>
                        <div class="flex justify-between text-slate-500"><span>Sisa tagihan</span><span x-text="formatCurrency(invoiceData?.remaining_amount)"></span></div>
                        <div class="flex justify-between border-t border-slate-200 pt-3 text-base font-bold text-[#0d1b72]"><span>Dibayar</span><span x-text="formatCurrency(invoiceData?.amount)"></span></div>
                    </div>
                </div>

                <footer class="mt-10 pt-5 border-t border-dashed border-slate-300 flex flex-col sm:flex-row justify-between gap-4 text-xs text-slate-500">
                    <div>
                        <p class="font-semibold text-slate-700">Terima kasih atas pembayaran Anda.</p>
                        <p class="mt-1">Invoice ini diterbitkan oleh sistem Keuangan Pondok.</p>
                    </div>
                    <div class="sm:text-right">
                        <p>Dicatat oleh</p>
                        <p class="font-semibold text-slate-700 mt-1" x-text="invoiceData?.recipient"></p>
                    </div>
                </footer>
            </div>
            <div class="h-1 bg-[#919f0f]"></div>
        </article>
    </div>
</div>
