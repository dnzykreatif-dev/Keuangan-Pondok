<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan Pondok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://unpkg.com">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script defer src="https://unpkg.com/lucide@latest"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    :root {
        --ui-bg: #e9f1f8;
        --ui-surface: #ffffff;
        --ui-surface-soft: #f5f8fc;
        --ui-border: #dbe5ef;
        --ui-text: #243041;
        --ui-muted: #65758a;
        --ui-primary: #1f7ad9;
        --ui-primary-dark: #1863b2;
        --ui-sidebar: #3f4860;
        --ui-sidebar-deep: #343c51;
        --ui-success: #42be27;
        --ui-danger: #ff154b;
        --ui-warning: #f59e0b;
        --ui-teal: #0f9f8e;
        --ui-indigo: #4f46e5;
        --ui-rose: #e11d48;
        --ui-shadow: 0 10px 28px rgba(34, 64, 102, 0.10);
        --ui-shadow-soft: 0 6px 18px rgba(34, 64, 102, 0.08);
    }

    body {
        font-family: 'Poppins', sans-serif;
        background:
            radial-gradient(circle at top right, rgba(31, 122, 217, 0.14), transparent 32%),
            linear-gradient(180deg, #f9fbfe 0%, var(--ui-bg) 100%);
        color: var(--ui-text);
        -webkit-font-smoothing: antialiased;
    }

    #initial-splash {
        position: fixed;
        inset: 0;
        z-index: 120;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, rgba(249, 251, 254, 0.98) 0%, rgba(233, 241, 248, 0.98) 100%);
        transition: opacity 180ms ease, visibility 180ms ease;
    }

    #initial-splash.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }

    .initial-splash-card {
        min-width: 240px;
        padding: 1.25rem 1.5rem;
        border-radius: 1.25rem;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(219, 229, 239, 0.95);
        box-shadow: 0 16px 36px rgba(34, 64, 102, 0.14);
        display: flex;
        align-items: center;
        gap: 0.9rem;
    }

    .initial-splash-spinner {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 9999px;
        border: 3px solid rgba(31, 122, 217, 0.14);
        border-top-color: var(--ui-primary);
        animation: spin 0.9s linear infinite;
        flex: none;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    [x-cloak] { display: none !important; }

    @media print {
        body { background: #ffffff !important; }
        body > *:not(#invoice-modal) { display: none !important; }
        #invoice-modal { position: static !important; display: block !important; background: #ffffff !important; padding: 0 !important; }
        #invoice-modal > div { max-width: none !important; }
        .invoice-toolbar { display: none !important; }
        .invoice-paper { box-shadow: none !important; border-radius: 0 !important; }
        @page { size: A4; margin: 12mm; }

        body.print-arrears > *:not(#arrears-print-sheet) { display: none !important; }
        body.print-arrears #arrears-print-sheet { display: block !important; position: static !important; color: #172033 !important; }
        body.print-arrears #arrears-print-sheet .print-sheet-card { break-inside: avoid; }
        body.print-arrears #arrears-print-sheet .print-sheet-table { border-collapse: collapse; width: 100%; }
        body.print-arrears #arrears-print-sheet .print-sheet-table th,
        body.print-arrears #arrears-print-sheet .print-sheet-table td { border-bottom: 1px solid #d9e1eb; padding: 8px 4px; text-align: left; }
        body.print-arrears #arrears-print-sheet .print-sheet-table th:last-child,
        body.print-arrears #arrears-print-sheet .print-sheet-table td:last-child { text-align: right; }
    }
    .glass,
    .glass-dark,
    .panel {
        background: var(--ui-surface);
        color: var(--ui-text);
        border: 1px solid var(--ui-border);
        box-shadow: var(--ui-shadow);
        backdrop-filter: none;
    }

    .glass-dark {
        box-shadow: var(--ui-shadow-soft);
    }

    .focus-ring:focus-visible {
        outline: 2px solid var(--ui-primary);
        outline-offset: 2px;
    }

    .app-shell {
        min-height: 100vh;
    }

    .app-sidebar {
        background: linear-gradient(180deg, var(--ui-sidebar) 0%, var(--ui-sidebar-deep) 100%);
        color: #f4f7fb;
        box-shadow: inset -1px 0 0 rgba(255, 255, 255, 0.05);
    }

    .app-sidebar .sidebar-logo {
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .app-sidebar .sidebar-section-title {
        color: rgba(255, 255, 255, 0.55);
        font-size: 11px;
        letter-spacing: 0.1em;
    }

    .app-sidebar .sidebar-section-note {
        color: rgba(255, 255, 255, 0.45);
    }

    .sidebar-item-active {
        background: rgba(255, 255, 255, 0.10);
        color: #ffffff;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
    }

    .topbar {
        background: linear-gradient(180deg, #1f7ad9 0%, #1770cc 100%);
        box-shadow: 0 8px 22px rgba(28, 91, 160, 0.18);
    }

    .topbar .icon-btn {
        color: rgba(255, 255, 255, 0.95);
    }

    .page-crumb {
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid var(--ui-border);
        color: #59729a;
        box-shadow: 0 2px 10px rgba(34, 64, 102, 0.04);
    }

    .app-content {
        color: var(--ui-text);
    }

    .app-content .glass,
    .app-content .glass-dark,
    .app-content .panel {
        background: var(--ui-surface) !important;
        border-color: var(--ui-border) !important;
        color: var(--ui-text) !important;
        box-shadow: var(--ui-shadow) !important;
    }

    .app-content .bg-zinc-900,
    .app-content .bg-zinc-900\/50,
    .app-content .bg-zinc-800,
    .app-content .bg-zinc-800\/50 {
        background-color: var(--ui-surface-soft) !important;
        color: var(--ui-text) !important;
    }

    .app-content .hover\:bg-zinc-800\/50:hover,
    .app-content .hover\:bg-zinc-700:hover {
        background-color: #edf4fb !important;
    }

    .app-content .border-zinc-800,
    .app-content .border-zinc-700,
    .app-content .border-zinc-900 {
        border-color: var(--ui-border) !important;
    }

    .app-content .divide-zinc-800 > :not([hidden]) ~ :not([hidden]),
    .app-content .divide-zinc-700 > :not([hidden]) ~ :not([hidden]) {
        border-color: #e6edf5 !important;
    }

    .app-content .text-zinc-500 {
        color: var(--ui-muted) !important;
    }

    .app-content .text-zinc-400 {
        color: #6f8198 !important;
    }

    .app-content input:not([type="checkbox"]):not([type="radio"]),
    .app-content select,
    .app-content textarea {
        background: #ffffff !important;
        border: 1px solid var(--ui-border) !important;
        color: var(--ui-text) !important;
        border-radius: 10px !important;
        box-shadow: inset 0 1px 2px rgba(34, 64, 102, 0.05);
    }

    .app-content input:not([type="checkbox"]):not([type="radio"]):focus,
    .app-content select:focus,
    .app-content textarea:focus {
        border-color: var(--ui-primary) !important;
        box-shadow: 0 0 0 3px rgba(31, 122, 217, 0.14) !important;
        outline: none !important;
    }

    .app-content table {
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
    }

    .app-content thead th {
        background: #f4f8fc !important;
        color: #4f6279 !important;
        font-size: 12px !important;
        font-weight: 700 !important;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-color: var(--ui-border) !important;
    }

    .app-content tbody td {
        border-color: #e6edf5 !important;
    }

    .app-content tbody tr:hover {
        background: #f5f9fd !important;
    }

    .stat-card {
        color: #ffffff !important;
        box-shadow: var(--ui-shadow-soft);
    }

    .stat-card .text-zinc-500,
    .stat-card .text-zinc-400,
    .stat-card .text-slate-500,
    .stat-card p {
        color: rgba(255, 255, 255, 0.88) !important;
    }

    .stat-blue { background: linear-gradient(135deg, #2f8ae7, #2574d4); }
    .stat-green { background: linear-gradient(135deg, #50bf2a, #39a41f); }
    .stat-orange { background: linear-gradient(135deg, #ff8b2d, #ff6b1f); }
    .stat-red { background: linear-gradient(135deg, #ff0f4f, #e6003f); }
    .stat-purple { background: linear-gradient(135deg, #8b5cf6, #6d28d9); }
    .stat-teal { background: linear-gradient(135deg, #14b8a6, #0f8c7e); }
    .stat-indigo { background: linear-gradient(135deg, #6366f1, #4338ca); }

    .page-accent {
        --accent: var(--ui-primary);
        --accent-soft: rgba(31, 122, 217, 0.12);
        --accent-faint: rgba(31, 122, 217, 0.06);
    }

    .accent-blue { --accent: var(--ui-primary); --accent-soft: rgba(31, 122, 217, 0.14); --accent-faint: rgba(31, 122, 217, 0.06); }
    .accent-green { --accent: var(--ui-success); --accent-soft: rgba(66, 190, 39, 0.16); --accent-faint: rgba(66, 190, 39, 0.07); }
    .accent-red { --accent: var(--ui-danger); --accent-soft: rgba(255, 21, 75, 0.15); --accent-faint: rgba(255, 21, 75, 0.06); }
    .accent-orange { --accent: var(--ui-warning); --accent-soft: rgba(245, 158, 11, 0.17); --accent-faint: rgba(245, 158, 11, 0.07); }
    .accent-purple { --accent: #8b5cf6; --accent-soft: rgba(139, 92, 246, 0.15); --accent-faint: rgba(139, 92, 246, 0.06); }
    .accent-teal { --accent: var(--ui-teal); --accent-soft: rgba(15, 159, 142, 0.15); --accent-faint: rgba(15, 159, 142, 0.06); }
    .accent-indigo { --accent: var(--ui-indigo); --accent-soft: rgba(79, 70, 229, 0.15); --accent-faint: rgba(79, 70, 229, 0.06); }
    .accent-rose { --accent: var(--ui-rose); --accent-soft: rgba(225, 29, 72, 0.15); --accent-faint: rgba(225, 29, 72, 0.06); }

    .page-accent .glass,
    .page-accent .panel {
        position: relative;
        overflow: hidden;
    }

    .page-accent .glass::before,
    .page-accent .panel::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 4px;
        background: linear-gradient(90deg, var(--accent), transparent 72%);
        opacity: 0.95;
        pointer-events: none;
    }

    .page-accent .glass > *,
    .page-accent .panel > * {
        position: relative;
    }

    .page-accent thead th {
        background: linear-gradient(180deg, var(--accent-faint), #f7fbff) !important;
        color: #344866 !important;
    }

    .page-accent tbody tr:nth-child(even) {
        background: #fbfdff;
    }

    .page-accent tbody tr:hover {
        background: var(--accent-faint) !important;
    }

    .page-accent tbody button:not(.btn-action),
    .page-accent tbody a:not(.btn-action) {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 0.75rem;
        padding: 0.45rem 0.7rem;
        font-size: 0.75rem;
        font-weight: 800;
        background: var(--accent-soft);
        color: var(--accent);
        transition: filter 0.15s ease, transform 0.08s ease;
    }

    .page-accent tbody button:not(.btn-action):hover,
    .page-accent tbody a:not(.btn-action):hover {
        filter: brightness(0.96);
    }

    .page-accent tbody button:not(.btn-action):active,
    .page-accent tbody a:not(.btn-action):active {
        transform: translateY(1px);
    }

    .btn-soft {
        background: #ffffff;
        color: var(--ui-text);
        border: 1px solid var(--ui-border);
        box-shadow: 0 3px 10px rgba(34, 64, 102, 0.06);
    }

    .btn-soft:hover {
        background: #f4f8fc;
    }

    .btn-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.45rem;
        border-radius: 0.9rem;
        border: 1px solid transparent;
        padding: 0.7rem 1rem;
        font-size: 0.875rem;
        font-weight: 700;
        line-height: 1;
        transition:
            background-color 0.15s ease,
            color 0.15s ease,
            border-color 0.15s ease,
            box-shadow 0.15s ease,
            transform 0.08s ease;
        outline: none;
    }

    .btn-action:active {
        transform: translateY(1px) scale(0.99);
    }

    .btn-action:focus-visible {
        box-shadow: 0 0 0 3px rgba(31, 122, 217, 0.18);
    }

    .btn-action-primary {
        background: linear-gradient(180deg, #2f8ae7 0%, #1f7ad9 100%);
        color: #ffffff;
        box-shadow: 0 8px 18px rgba(31, 122, 217, 0.22);
    }

    .btn-action-primary:hover {
        background: linear-gradient(180deg, #3690eb 0%, #186bca 100%);
        box-shadow: 0 10px 22px rgba(31, 122, 217, 0.28);
    }

    .btn-action-success {
        background: linear-gradient(180deg, #4fc437 0%, #3aa923 100%);
        color: #ffffff;
        box-shadow: 0 8px 18px rgba(66, 190, 39, 0.22);
    }

    .btn-action-success:hover {
        background: linear-gradient(180deg, #57cc40 0%, #31961c 100%);
        box-shadow: 0 10px 22px rgba(66, 190, 39, 0.28);
    }

    .btn-action-danger {
        background: linear-gradient(180deg, #ff3567 0%, #f01851 100%);
        color: #ffffff;
        box-shadow: 0 8px 18px rgba(255, 21, 75, 0.20);
    }

    .btn-action-danger:hover {
        background: linear-gradient(180deg, #ff4674 0%, #e21046 100%);
        box-shadow: 0 10px 22px rgba(255, 21, 75, 0.26);
    }

    .btn-action-ghost {
        background: #ffffff;
        color: var(--ui-text);
        border-color: var(--ui-border);
        box-shadow: 0 4px 10px rgba(34, 64, 102, 0.08);
    }

    .btn-action-ghost:hover {
        background: #f4f8fc;
        border-color: #c8d6e6;
    }

    .btn-action-sm {
        padding: 0.55rem 0.85rem;
        border-radius: 0.8rem;
        font-size: 0.78rem;
    }

    .content-title {
        color: var(--ui-text);
        letter-spacing: -0.03em;
    }

    .content-subtitle {
        color: var(--ui-muted);
    }

    .focus-ring:focus-visible {
        outline: 2px solid var(--ui-primary);
        outline-offset: 2px;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #b4c4d7; border-radius: 10px; }
    .animate-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
<script>
    tailwind.config = {
        theme: {
            extend: {
                fontFamily: {
                    sans: ['Poppins', 'sans-serif']
                },
                colors: {
                    surface: '#e9f1f8',
                    primary: '#1f7ad9',
                    secondary: '#1863b2',
                    success: '#42be27',
                    danger: '#ff154b',
                    warning: '#f59e0b'
                }
            }
        }
    }
</script>
