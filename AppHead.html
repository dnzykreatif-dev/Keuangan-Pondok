<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keuangan Pondok</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
    body { font-family: 'IBM Plex Sans', sans-serif; background-color: #09090b; color: #fafafa; -webkit-font-smoothing: antialiased; }
    [x-cloak] { display: none !important; }
    .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-dark { background: rgba(0, 0, 0, 0.3); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    .focus-ring:focus-visible { outline: 2px solid #0C5CAB; outline-offset: 2px; }
    .sidebar-item-active { background: rgba(12, 92, 171, 0.1); color: #3b82f6; border-right: 2px solid #0C5CAB; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    .animate-in { animation: fadeIn 0.3s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
<script>
    tailwind.config = {
        theme: {
            extend: {
                colors: {
                    surface: '#09090b',
                    primary: '#0C5CAB',
                    secondary: '#0a4a8a',
                    success: '#10b981',
                    danger: '#ef4444'
                }
            }
        }
    }
</script>
