<div x-show="showArrearsShareModal" x-cloak class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm z-[70] flex items-center justify-center p-4">
    <div class="panel rounded-3xl w-full max-w-lg overflow-hidden" @click.away="showArrearsShareModal = false">
        <div class="p-6 bg-gradient-to-br from-emerald-600 to-teal-700 text-white">
            <div class="flex items-start justify-between gap-4">
                <div>
                    <p class="text-xs uppercase tracking-[0.18em] text-emerald-100">Siap dibagikan ke wali</p>
                    <h2 class="text-2xl font-bold mt-2" x-text="arrearsSharePreview?.student_name || '-'"></h2>
                    <p class="text-sm text-emerald-100 mt-1" x-text="arrearsSharePreview?.class_name || '-'"></p>
                </div>
                <button @click="showArrearsShareModal = false" class="text-white/80 hover:text-white" aria-label="Tutup"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <div class="mt-5 flex items-end justify-between">
                <div><p class="text-xs text-emerald-100">Total tunggakan</p><p class="text-3xl font-bold" x-text="formatCurrency(arrearsSharePreview?.total || 0)"></p></div>
                <span class="text-sm text-emerald-100" x-text="(arrearsSharePreview?.bill_count || 0) + ' bulan'"></span>
            </div>
        </div>
        <div class="p-6">
            <div class="rounded-2xl bg-slate-50 border border-slate-200 p-4">
                <p class="text-xs font-bold uppercase tracking-wide text-slate-400 mb-3">Rincian periode</p>
                <div class="space-y-2 max-h-40 overflow-y-auto">
                    <template x-for="item in (arrearsSharePreview?.items || [])" :key="item.billing_label">
                        <div class="flex items-center justify-between gap-3 text-sm"><span x-text="item.billing_label"></span><span class="font-semibold text-danger" x-text="formatCurrency(item.amount)"></span></div>
                    </template>
                </div>
            </div>
            <div class="mt-4 flex items-center justify-between gap-3 text-sm">
                <div><p class="text-slate-500">Nomor wali</p><p class="font-mono font-semibold" x-text="arrearsSharePreview?.phone || arrearsSharePreview?.raw_phone || '-'"></p><p class="text-xs text-warning mt-1" x-text="arrearsSharePreview?.note"></p></div>
                <button @click="openArrearsShareLink()" :disabled="!arrearsSharePreview?.link" class="btn-action btn-action-success px-4 py-3 rounded-xl whitespace-nowrap" :class="!arrearsSharePreview?.link && 'opacity-50 cursor-not-allowed'"><i data-lucide="message-circle" class="w-5 h-5"></i><span>Buka WhatsApp</span></button>
            </div>
            <button @click="showArrearsShareModal = false" class="w-full mt-5 btn-soft py-3 rounded-xl text-sm font-semibold">Tutup</button>
        </div>
    </div>
</div>
