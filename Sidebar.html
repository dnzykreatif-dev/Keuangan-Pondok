<aside :class="mobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'"
       class="app-sidebar fixed inset-y-0 left-0 z-50 w-[86vw] max-w-[280px] md:w-[280px] flex flex-col transition-transform duration-300 md:relative">
    <div class="sidebar-logo flex items-center gap-3 px-6 py-5">
        <template x-if="settings.logo_url">
            <img :src="settings.logo_url" class="w-11 h-11 object-contain rounded-xl bg-white/95 p-1">
        </template>
        <template x-if="!settings.logo_url">
            <div class="w-11 h-11 rounded-xl bg-white/10 flex items-center justify-center">
                <i data-lucide="building-2" class="w-6 h-6 text-white"></i>
            </div>
        </template>
        <div class="min-w-0">
            <h2 class="text-xl font-semibold leading-tight truncate" x-text="settings.school_name || 'Keuangan Pondok'"></h2>
            <p class="text-xs text-white/55 truncate">Multipurpose dashboard</p>
        </div>
    </div>

    <nav class="flex-1 overflow-y-auto px-4 py-5 space-y-6">
        <section class="space-y-2">
            <p class="sidebar-section-title px-3">Dashboard</p>
            <button @click="openView('dashboard')" :class="view === 'dashboard' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-3 rounded-xl flex items-center gap-3 transition-all">
                <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                <span class="font-medium">Dashboard Keuangan</span>
            </button>
        </section>

        <section class="space-y-2">
            <p class="sidebar-section-title px-3">Pendapatan dan Pengeluaran</p>
            <p class="sidebar-section-note px-3 -mt-1 text-xs">Kelola kas keluar dan masuk</p>
            <div class="space-y-1.5">
                <button @click="openView('santri')" :class="view === 'santri' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="users" class="w-5 h-5"></i><span>Data Santri</span></button>
                <button @click="openView('billing')" :class="view === 'billing' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="file-text" class="w-5 h-5"></i><span>Tagihan SPP</span></button>
                <button @click="openView('payments')" :class="view === 'payments' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="credit-card" class="w-5 h-5"></i><span>Pembayaran</span></button>
                <button @click="openView('arrears')" :class="view === 'arrears' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="clock" class="w-5 h-5"></i><span>Tunggakan</span></button>
                <button @click="openView('expenses')" :class="view === 'expenses' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="receipt" class="w-5 h-5"></i><span>Pengeluaran</span></button>
                <button @click="openView('donations')" :class="view === 'donations' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="hand-heart" class="w-5 h-5"></i><span>Donasi</span></button>
                <button @click="openView('cash')" :class="view === 'cash' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="wallet" class="w-5 h-5"></i><span>Kas</span></button>
                <button @click="openView('development')" :class="view === 'development' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="landmark" class="w-5 h-5"></i><span>Dana Pembangunan</span></button>
            </div>
        </section>

        <section class="space-y-2">
            <p class="sidebar-section-title px-3">Laporan</p>
            <p class="sidebar-section-note px-3 -mt-1 text-xs">Ringkasan data operasional</p>
            <button @click="openView('reports')" :class="view === 'reports' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="bar-chart-3" class="w-5 h-5"></i><span>Laporan Keuangan</span></button>
            <button @click="openView('journals')" x-show="user.role === 'Admin' && showAdvancedAccounting" :class="view === 'journals' ? 'sidebar-item-active' : 'text-white/70 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="book-open" class="w-5 h-5"></i><span>Jurnal</span></button>
            <button @click="openView('accountingReports')" x-show="user.role === 'Admin' && showAdvancedAccounting" :class="view === 'accountingReports' ? 'sidebar-item-active' : 'text-white/70 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="file-spreadsheet" class="w-5 h-5"></i><span>Laporan Akuntansi</span></button>
        </section>

        <section class="space-y-2">
            <p class="sidebar-section-title px-3">Aplikasi</p>
            <p class="sidebar-section-note px-3 -mt-1 text-xs">Menu pengaturan aplikasi</p>
            <button @click="openView('settings')" :class="view === 'settings' ? 'sidebar-item-active' : 'text-white/75 hover:bg-white/10 hover:text-white'" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 transition-all"><i data-lucide="settings" class="w-5 h-5"></i><span>Pengaturan</span></button>
            <button x-show="user.role === 'Admin'" @click="showAdvancedAccounting = !showAdvancedAccounting" class="w-full text-left px-4 py-2.5 rounded-xl flex items-center gap-3 text-white/70 hover:bg-white/10 hover:text-white transition-all">
                <i data-lucide="shield" class="w-5 h-5"></i>
                <span>Mode Akuntansi</span>
            </button>
        </section>
    </nav>

    <div class="px-4 pb-5 pt-4 border-t border-white/10">
        <div class="flex items-center gap-3 px-2 py-3 mb-4">
            <div class="w-10 h-10 rounded-full bg-white/10 flex items-center justify-center text-sm font-bold" x-text="user.username?.charAt(0).toUpperCase()"></div>
            <div class="overflow-hidden">
                <p class="text-sm font-medium truncate text-white" x-text="user.username"></p>
                <p class="text-xs text-white/55 truncate" x-text="user.role"></p>
            </div>
        </div>
        <button @click="logout" class="w-full bg-white/10 hover:bg-white/15 text-white px-4 py-2.5 rounded-xl flex items-center justify-center gap-3 transition-colors">
            <i data-lucide="log-out" class="w-4 h-4"></i>
            <span class="text-sm font-medium">Logout</span>
        </button>
    </div>
</aside>
