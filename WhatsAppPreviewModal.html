<div x-show="showWhatsAppPreviewModal" x-cloak class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[65] flex items-start sm:items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div class="panel p-5 sm:p-8 rounded-2xl w-full max-w-4xl my-auto max-h-[92vh] overflow-y-auto" @click.away="showWhatsAppPreviewModal = false">
        <div class="flex flex-col gap-3 sm:flex-row sm:items-start sm:justify-between mb-5">
            <div>
                <h2 class="text-xl font-semibold" x-text="whatsAppPreview.title || 'Preview Notifikasi WhatsApp'"></h2>
                <p class="text-sm text-slate-500 mt-1" x-text="whatsAppPreview.subtitle || 'Daftar pesan siap dibuka di WhatsApp'"></p>
                <p class="text-xs text-slate-400 mt-2" x-show="whatsAppPreview.sender_name" x-text="'Pengirim: ' + whatsAppPreview.sender_name"></p>
            </div>
            <div class="flex gap-3">
                <button @click="openSequentialWhatsAppLinks()" class="btn-soft px-4 py-2 rounded-lg text-sm font-semibold" x-show="(whatsAppPreview.items || []).some(item => item.link)">
                    Kirim Berurutan
                </button>
                <button @click="showWhatsAppPreviewModal = false" class="btn-soft px-4 py-2 rounded-lg text-sm font-semibold">Tutup</button>
            </div>
        </div>

        <div class="grid gap-3 sm:grid-cols-3 mb-6">
            <div class="p-4 rounded-2xl bg-[#eff6ff] border border-[#d5e4fb]">
                <p class="text-xs uppercase tracking-wide text-slate-500">Total Target</p>
                <p class="text-2xl font-semibold mt-1" x-text="whatsAppPreview.summary?.total || 0"></p>
            </div>
            <div class="p-4 rounded-2xl bg-[#ecfdf5] border border-[#cdeedc]">
                <p class="text-xs uppercase tracking-wide text-slate-500">Nomor Valid</p>
                <p class="text-2xl font-semibold mt-1" x-text="whatsAppPreview.summary?.valid || 0"></p>
            </div>
            <div class="p-4 rounded-2xl bg-[#fff7ed] border border-[#f8dfbf]">
                <p class="text-xs uppercase tracking-wide text-slate-500">Perlu Diperbaiki</p>
                <p class="text-2xl font-semibold mt-1" x-text="(whatsAppPreview.summary?.invalid || 0) + (whatsAppPreview.summary?.missing_phone || 0)"></p>
            </div>
        </div>

        <div class="overflow-x-auto rounded-2xl border border-[#e6edf5]">
            <table class="w-full text-left bg-white">
                <thead class="bg-[#f8fbff]">
                    <tr>
                        <th class="p-4">Santri</th>
                        <th class="p-4">Periode</th>
                        <th class="p-4">Nominal</th>
                        <th class="p-4">Nomor Wali</th>
                        <th class="p-4">Status</th>
                        <th class="p-4">Aksi</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-[#e6edf5]">
                    <template x-for="item in whatsAppPreview.items" :key="item.id_billing">
                        <tr class="hover:bg-[#f8fbff] transition-colors">
                            <td class="p-4">
                                <div class="font-semibold" x-text="item.student_name"></div>
                                <div class="text-xs text-slate-400" x-text="item.class_name || '-'"></div>
                            </td>
                            <td class="p-4 text-sm" x-text="item.billing_label"></td>
                            <td class="p-4 text-sm font-semibold" x-text="formatCurrency(item.amount)"></td>
                            <td class="p-4 text-sm">
                                <div class="font-mono" x-text="item.phone || '-'"></div>
                                <div class="text-xs text-slate-400 mt-1" x-text="item.note"></div>
                            </td>
                            <td class="p-4">
                                <span class="px-2 py-1 rounded text-xs font-semibold" :class="item.is_valid_phone ? 'bg-success/20 text-success' : 'bg-warning/20 text-warning'" x-text="item.is_valid_phone ? 'Valid' : 'Perlu Perbaikan'"></span>
                            </td>
                            <td class="p-4">
                                <button
                                    @click="openWhatsAppLink(item.link)"
                                    :disabled="!item.link"
                                    class="text-sm font-semibold"
                                    :class="item.link ? 'text-primary hover:underline' : 'text-slate-300 cursor-not-allowed'">
                                    Buka WhatsApp
                                </button>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="!whatsAppPreview.items || whatsAppPreview.items.length === 0">
                        <td colspan="6" class="p-6 text-center text-sm text-slate-500">Belum ada notifikasi yang perlu dipreview.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
