<div x-show="view === 'arrears'" class="animate-in space-y-4">
    <div class="glass p-5 rounded-2xl flex flex-col sm:flex-row justify-between gap-4 sm:items-center">
        <div class="flex items-center gap-3">
            <label class="text-sm font-medium text-slate-500">Filter Kelas:</label>
            <select x-model="selectedClassFilter" class="px-3 py-2 text-sm outline-none focus:ring-1 focus:ring-primary">
                <option value="">Semua Kelas</option>
                <template x-for="cls in uniqueClasses" :key="cls"><option :value="cls" x-text="cls"></option></template>
            </select>
        </div>
        <div class="text-sm text-zinc-500">Menampilkan <span class="text-slate-900 font-bold" x-text="getFilteredArrears().length"></span> tunggakan</div>
    </div>
    <div class="glass rounded-2xl overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full text-left">
                <thead>
                    <tr><th class="p-4">Nama</th><th class="p-4">Kelas</th><th class="p-4">Bulan/Tahun</th><th class="p-4 text-right">Nominal</th><th class="p-4">Aksi</th></tr>
                </thead>
                <tbody class="divide-y divide-[#e6edf5]">
                    <template x-for="a in getFilteredArrears()" :key="a.id_billing">
                        <tr class="hover:bg-[#f5f9fd] transition-colors">
                            <td class="p-4 font-semibold" x-text="a.nama"></td>
                            <td class="p-4" x-text="a.kelas"></td>
                            <td class="p-4" x-text="a.bulan + ' ' + a.tahun"></td>
                            <td class="p-4 text-right">
                                <p class="text-danger font-semibold" x-text="formatCurrency(a.remaining_amount || a.nominal)"></p>
                                <p x-show="a.paid_amount > 0" class="text-xs text-zinc-500" x-text="'Dibayar ' + formatCurrency(a.paid_amount)"></p>
                            </td>
                            <td class="p-4">
                                <div class="flex flex-wrap gap-2">
                                    <a :href="'https://wa.me/' + a.kontak + '?text=Assalamu%27alaikum%2C%20mohon%20segera%20melunasi%20SPP%20bulan%20' + a.bulan" target="_blank" class="bg-success/20 text-success px-3 py-1 rounded text-xs font-semibold">Remind WA</a>
                                    <button @click="editBillingData(a)" class="bg-primary/20 text-primary px-3 py-1 rounded text-xs font-semibold">Edit</button>
                                    <button @click="deleteBillingData(a)" class="bg-danger/20 text-danger px-3 py-1 rounded text-xs font-semibold">Hapus</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="getFilteredArrears().length === 0">
                        <td colspan="5" class="p-6 text-center text-sm text-zinc-500">Tidak ada tunggakan pada filter ini.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
