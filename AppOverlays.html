<!-- Global Loading Overlay -->
<div x-show="loading" x-cloak class="fixed inset-0 z-[100] bg-surface/60 backdrop-blur-sm flex items-center justify-center">
    <div class="flex flex-col items-center gap-3">
        <svg class="animate-spin h-10 w-10 text-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="text-sm font-medium text-zinc-400">Processing...</span>
    </div>
</div>

<!-- Toast Notifications -->
<div class="fixed bottom-4 right-4 z-[110] space-y-2">
    <template x-for="toast in toasts" :key="toast.id">
        <div x-show="toast.show" x-transition class="glass px-6 py-3 rounded-xl shadow-2xl flex items-center gap-3 border-l-4"
             :class="toast.type === 'success' ? 'border-success' : 'border-danger'">
            <i :data-lucide="toast.type === 'success' ? 'check-circle' : 'alert-circle'" class="w-5 h-5" :class="toast.type === 'success' ? 'text-success' : 'text-danger'"></i>
            <span class="text-sm font-medium" x-text="toast.message"></span>
        </div>
    </template>
</div>
