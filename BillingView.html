<div x-show="view === 'billing'" class="animate-in page-accent accent-indigo">
    <div class="glass p-8 rounded-2xl max-w-2xl">
        <div class="mb-6 flex items-start gap-4">
            <div class="w-12 h-12 rounded-2xl bg-primary/10 text-primary flex items-center justify-center">
                <i data-lucide="file-plus-2" class="w-6 h-6"></i>
            </div>
            <div>
                <h2 class="text-xl font-semibold mb-2">Generate Tagihan SPP</h2>
                <p class="text-sm text-zinc-500">Buat tagihan untuk semua santri aktif, kelas tertentu, atau satu nama santri. Setelah sukses, preview WhatsApp akan muncul untuk nomor wali yang valid.</p>
            </div>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-slate-500">Bulan & Tahun</label>
                <div class="grid grid-cols-2 gap-4">
                    <select x-model="genBill.month" class="p-2.5 outline-none focus:ring-1 focus:ring-primary">
                        <option value="Januari">Januari</option><option value="Februari">Februari</option><option value="Maret">Maret</option><option value="April">April</option><option value="Mei">Mei</option><option value="Juni">Juni</option><option value="Juli">Juli</option><option value="Agustus">Agustus</option><option value="September">September</option><option value="Oktober">Oktober</option><option value="November">November</option><option value="Desember">Desember</option>
                    </select>
                    <input type="number" x-model="genBill.year" class="p-2.5 outline-none focus:ring-1 focus:ring-primary">
                </div>
            </div>
            <div>
                <label class="block text-sm mb-1 text-slate-500">Target Tagihan</label>
                <select x-model="genBill.targetMode" @focus="fetchSantri" class="w-full p-2.5 outline-none focus:ring-1 focus:ring-primary">
                    <option value="ALL">Semua Santri Aktif</option>
                    <option value="CLASS">Kelas Tertentu</option>
                    <option value="STUDENT">Nama Santri Khusus</option>
                </select>
            </div>
            <div x-show="genBill.targetMode === 'CLASS'" x-cloak>
                <label class="block text-sm mb-1 text-slate-500">Kelas</label>
                <select x-model="genBill.classFilter" @focus="fetchSantri" class="w-full p-2.5 outline-none focus:ring-1 focus:ring-primary">
                    <option value="">Pilih kelas</option>
                    <template x-for="cls in uniqueClasses" :key="cls"><option :value="cls" x-text="cls"></option></template>
                </select>
            </div>
            <div x-show="genBill.targetMode === 'STUDENT'" x-cloak>
                <label class="block text-sm mb-1 text-slate-500">Nama Santri</label>
                <select x-model="genBill.studentFilter" @focus="fetchSantri" class="w-full p-2.5 outline-none focus:ring-1 focus:ring-primary">
                    <option value="">Pilih santri</option>
                    <template x-for="student in activeSantriList" :key="student.id_santri">
                        <option :value="student.id_santri" x-text="student.nama + (student.kelas ? ' - ' + student.kelas : '')"></option>
                    </template>
                </select>
            </div>
            <div>
                <label class="block text-sm mb-1 text-slate-500">Nominal (Rp)</label>
                <input type="number" x-model="genBill.nominal" class="w-full p-2.5 outline-none focus:ring-1 focus:ring-primary">
            </div>
            <button type="button" @click="handleGenerateBills" :disabled="loading" class="w-full btn-action btn-action-primary disabled:opacity-60 disabled:cursor-not-allowed">
                <i data-lucide="sparkles" class="w-4 h-4"></i>
                <span>Generate Tagihan</span>
            </button>
        </div>
    </div>
</div>
