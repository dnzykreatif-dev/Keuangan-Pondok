<script>
    const INITIAL_APP_SETTINGS = <?!= initialSettingsJson ?>;

    function app() {
        return {
            isLoggedIn: false,
            appReady: false,
            loading: false,
            loadingWatchdogStartedAt: 0,
            bootstrapping: false,
            mobileMenuOpen: false,
            showAdvancedAccounting: false,
            toasts: [],
            view: 'dashboard',
            user: {},
            auth: { username: '', password: '' },
            stats: { cashBalance: 0, incomeThisMonth: 0, expenseThisMonth: 0, totalArrears: 0, donationThisMonth: 0, activeSantriCount: 0 },
            dashboardData: { incomeVsExpense: [], topExpenses: [], unpaidBills: [] },
            dashboardFilter: { mode: 'ALL', month: ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'][new Date().getMonth()], year: new Date().getFullYear() },
            settings: { school_name: '', logo_url: '', payment_methods: '', ewallet_info: '', ...INITIAL_APP_SETTINGS },
            installationManifest: { mode: 'legacy', tenantId: '', ready: false, checks: [], note: '' },
            tenantProvisioningForm: { pondokName: '', tenantId: '', ownerEmail: '', supportEmail: '' },
            tenantProvisioningResult: null,
            tenantProvisioningBusy: false,
            dataLoaded: {
                dashboardKey: '',
                santri: false,
                arrears: false,
                paymentOrders: false,
                expenseList: false,
                expenseCategories: false,
                donationList: false,
                cashTransactions: false,
                developmentProjects: false,
                operationalReport: false,
                journalEntries: false,
                reportData: false,
                activityReportKey: ''
            },
            santriList: [],
            santriSearch: '',
            selectedStudentProfile: null,
            arrearsList: [],
            journalEntries: [],
            paymentOrders: [],
            expenseCategories: [],
            expenseList: [],
            donationList: [],
            cashTransactions: [],
            developmentProjects: [],
            operationalReport: {
                spp: { total: 0, paid: 0, unpaid: 0, paidAmount: 0, unpaidAmount: 0, paidPercentage: 0 },
                donations: { totalReceived: 0, pledged: 0, topDonors: [] },
                expenses: { total: 0, byCategory: [] },
                cash: { totalIn: 0, totalOut: 0, balance: 0, ledger: [] }
            },
            activityFilter: { month: ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'][new Date().getMonth()], year: new Date().getFullYear() },
            activityReport: {
                period: { month: '', year: '', label: '' },
                summary: { totalIncome: 0, totalExpense: 0, surplusDeficit: 0, isSurplus: true, surplusLabel: 'Surplus' },
                incomeByAccount: [],
                expenseByAccount: [],
                journalCount: 0,
                note: ''
            },
            reportData: {
                summary: { totalDebit: 0, totalCredit: 0, isBalanced: true, cashBank: 0, sppReceivable: 0 },
                trialBalance: [],
                netAssetSummary: [],
                financialPosition: { totalAssets: 0, totalLiabilities: 0, totalNetAssets: 0 },
                cashFlow: { operasi: 0, investasi: 0, pendanaan: 0, total: 0 },
                notes: { materialAccounts: [] }
            },
            selectedClassFilter: '',
            unpaidBills: [],
            showAddSantriModal: false,
            showPaymentModal: false,
            showInvoiceModal: false,
            showQrisModal: false,
            showWhatsAppPreviewModal: false,
            showArrearsShareModal: false,
            selectedSantri: null,
            newSantri: { nama: '', kelas: '', kontak_ortu: '' },
            genBill: { month: 'Januari', year: new Date().getFullYear(), nominal: 500000, targetMode: 'ALL', classFilter: '', studentFilter: '' },
            paymentData: { id_santri: '', id_billing: '', amount: 0, method: 'Tunai', proofBase64: '', penerima: '' },
            paymentOutcome: null,
            invoiceData: null,
            qrisData: { student_name: '', billing_label: '', amount: 0, qr_text: '', note: '' },
            whatsAppPreview: { enabled: false, title: '', subtitle: '', sender_name: '', summary: { total: 0, valid: 0, invalid: 0, missing_phone: 0 }, items: [] },
            arrearsSharePreview: null,
            arrearsPrintStudent: null,
            waTest: { phone: '', message: 'Tes notifikasi WhatsApp dari aplikasi Keuangan Pondok.' },
            pendingLogoFile: null,
            pendingLogoPreview: '',
            newExpense: { date: new Date().toISOString().slice(0, 10), category: 'Dapur', amount: '', supplier: '', method: 'Tunai', description: '', proofBase64: '', project_id: '' },
            newDonation: { date: new Date().toISOString().slice(0, 10), donor_name: '', phone: '', type: 'Donasi', status: 'Masuk', amount: '', method: 'Transfer', description: '', proofBase64: '', project_id: '' },
            newProject: { name: '', target_budget: '', description: '', status: 'Aktif', start_date: new Date().toISOString().slice(0, 10), end_date: '' },

            init() {
                window.setInterval(() => {
                    if (!this.loading) {
                        this.loadingWatchdogStartedAt = 0;
                        return;
                    }
                    if (!this.loadingWatchdogStartedAt) {
                        this.loadingWatchdogStartedAt = Date.now();
                        return;
                    }
                    if (Date.now() - this.loadingWatchdogStartedAt > 30000) {
                        this.loading = false;
                        this.loadingWatchdogStartedAt = 0;
                        this.notify('Proses terlalu lama atau koneksi terputus. Silakan coba lagi.', 'error');
                    }
                }, 1000);
                let savedUser = null;
                try {
                    const savedUserJson = localStorage.getItem('spp_user');
                    savedUser = savedUserJson ? JSON.parse(savedUserJson) : null;
                } catch (error) {
                    localStorage.removeItem('spp_user');
                    console.warn('Sesi login lama tidak valid, sesi dibersihkan.', error);
                }
                if (savedUser && typeof savedUser === 'object') {
                    this.user = savedUser;
                    this.isLoggedIn = true;
                    this.bootstrapping = true;
                    window.requestAnimationFrame(() => {
                        this.appReady = true;
                        this.hideInitialSplash();
                    });
                    try {
                        this.loadInitialAppData();
                    } catch (error) {
                        this.bootstrapping = false;
                        this.loading = false;
                        this.notify('Aplikasi gagal memuat data awal. Silakan refresh halaman.', 'error');
                        console.error('Bootstrap aplikasi gagal', error);
                    }
                } else {
                    window.requestAnimationFrame(() => {
                        this.appReady = true;
                        this.hideInitialSplash();
                    });
                }

                this.refreshIcons();
            },

            refreshIcons() {
                window.setTimeout(() => {
                    if (window.lucide && typeof window.lucide.createIcons === 'function') {
                        window.lucide.createIcons();
                    }
                }, 0);
            },

            hideInitialSplash() {
                const splash = document.getElementById('initial-splash');
                if (splash) splash.classList.add('is-hidden');
            },

            finishInitialLoad() {
                this.bootstrapping = false;
                this.appReady = true;
                this.hideInitialSplash();
                this.refreshIcons();
            },

            loadInitialAppData() {
                this.fetchSettings();
                this.fetchInstallationManifest();
                google.script.run
                    .withSuccessHandler(res => {
                        if (res.ok) {
                            const bootstrap = res.data || {};
                            if (bootstrap.dashboard) {
                                this.stats = bootstrap.dashboard.stats || this.stats;
                                this.dashboardData = bootstrap.dashboard;
                                this.dataLoaded.dashboardKey = this.getDashboardRequestKey();
                            }
                            if (Array.isArray(bootstrap.developmentProjects)) {
                                this.developmentProjects = bootstrap.developmentProjects;
                                this.dataLoaded.developmentProjects = true;
                            }
                            if (Array.isArray(bootstrap.expenseCategories)) {
                                this.expenseCategories = bootstrap.expenseCategories;
                                this.dataLoaded.expenseCategories = true;
                            }
                        } else {
                            this.notify(res.message, 'error');
                        }
                        this.finishInitialLoad();
                    })
                    .withFailureHandler(err => {
                        this.handleFailure(err);
                        this.finishInitialLoad();
                    })
                    .getBootstrapData();
            },

            invalidateData(...keys) {
                keys.forEach(key => {
                    if (key === 'dashboard') {
                        this.dataLoaded.dashboardKey = '';
                        return;
                    }
                    if (key === 'activityReport') {
                        this.dataLoaded.activityReportKey = '';
                        return;
                    }
                    if (Object.prototype.hasOwnProperty.call(this.dataLoaded, key)) {
                        this.dataLoaded[key] = false;
                    }
                });
            },

            fetchSettings() {
                google.script.run
                    .withSuccessHandler(res => { if(res.ok) this.settings = { ...this.settings, ...res.data }; })
                    .getAppSettings();
            },

            fetchInstallationManifest() {
                google.script.run
                    .withSuccessHandler(res => {
                        if (res && res.ok) this.installationManifest = res.data || this.installationManifest;
                    })
                    .withFailureHandler(err => {
                        console.warn('Manifest instalasi tidak dapat dimuat', err);
                    })
                    .getInstallationManifest(this.user);
            },

            createTenantInstallationAction() {
                const form = { ...this.tenantProvisioningForm };
                if (!form.pondokName || !form.tenantId || !form.ownerEmail) {
                    return this.notify('Nama pondok, TenantID, dan email pemilik wajib diisi.', 'error');
                }
                this.tenantProvisioningBusy = true;
                this.tenantProvisioningResult = null;
                google.script.run
                    .withSuccessHandler(res => {
                        this.tenantProvisioningBusy = false;
                        if (!res || !res.ok) return this.notify(res?.message || 'Provisioning gagal.', 'error');
                        this.tenantProvisioningResult = res.data || null;
                        this.notify(res.message || 'Paket instalasi berhasil dibuat.');
                    })
                    .withFailureHandler(err => {
                        this.tenantProvisioningBusy = false;
                        this.handleFailure(err);
                    })
                    .createTenantInstallation(form, this.user);
            },

            notify(message, type = 'success') {
                const id = Date.now();
                this.toasts.push({ id, message, type, show: true });
                setTimeout(() => {
                    const toast = this.toasts.find(t => t.id === id);
                    if (toast) toast.show = false;
                }, 3000);
            },

            handleLogin() {
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        this.refreshIcons();
                        if (res.ok) {
                            this.isLoggedIn = true;
                            this.user = res.user;
                            localStorage.setItem('spp_user', JSON.stringify(res.user));
                            this.notify("Selamat datang kembali!");
                            this.bootstrapping = true;
                            this.loadInitialAppData();
                        } else {
                            this.notify(res.message, 'error');
                        }
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .login(this.auth.username, this.auth.password);
            },

            handleFailure(err) {
                this.loading = false;
                this.notify(err.message || err.toString(), 'error');
            },

            getMonthOptions() {
                return ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
            },

            getDashboardRequestKey() {
                const mode = String(this.dashboardFilter.mode || 'ALL').toUpperCase();
                if (mode === 'ALL') return 'ALL';
                return `${mode}:${this.dashboardFilter.month || ''}:${this.dashboardFilter.year || ''}`;
            },

            getDashboardPeriodLabel() {
                if (String(this.dashboardFilter.mode || 'ALL').toUpperCase() === 'ALL') return 'Seluruh data';
                return `${this.dashboardFilter.month} ${this.dashboardFilter.year}`;
            },

            getDashboardMetricLabel(baseLabel) {
                if (String(this.dashboardFilter.mode || 'ALL').toUpperCase() === 'ALL') return `${baseLabel} Total`;
                return `${baseLabel} ${this.dashboardFilter.month} ${this.dashboardFilter.year}`;
            },

            setCurrentDashboardMonth() {
                this.dashboardFilter.mode = 'MONTH';
                this.dashboardFilter.month = this.getMonthOptions()[new Date().getMonth()];
                this.dashboardFilter.year = new Date().getFullYear();
                this.fetchDashboard(true);
            },

            setDashboardFilter(mode, month = null, year = null) {
                const normalizedMode = String(mode || 'ALL').toUpperCase();
                this.dashboardFilter.mode = normalizedMode === 'MONTH' ? 'MONTH' : 'ALL';
                if (this.dashboardFilter.mode === 'MONTH') {
                    this.dashboardFilter.month = month || this.dashboardFilter.month || this.getMonthOptions()[new Date().getMonth()];
                    this.dashboardFilter.year = year || this.dashboardFilter.year || new Date().getFullYear();
                }
                this.fetchDashboard(true);
            },

            applyDashboardMonthFilter() {
                this.setDashboardFilter('MONTH', this.dashboardFilter.month, this.dashboardFilter.year);
            },

            fetchDashboard(force = false, showLoading = false) {
                const dashboardKey = this.getDashboardRequestKey();
                if (!force && this.dataLoaded.dashboardKey === dashboardKey) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.stats = res.data.stats;
                            this.dashboardData = res.data;
                            this.dataLoaded.dashboardKey = dashboardKey;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getDashboardData(this.dashboardFilter.mode, this.dashboardFilter.month, this.dashboardFilter.year);
            },

            fetchSantri(force = false, showLoading = false) {
                if (!force && this.dataLoaded.santri) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.santriList = res.data;
                            this.dataLoaded.santri = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getSantriList();
            },

            selectPaymentStudentFromMenu() {
                const selected = this.santriList.find(item => item.id_santri === this.paymentData.id_santri);
                this.selectedSantri = selected || null;
                this.paymentOutcome = null;
                this.unpaidBills = [];
                this.paymentData = {
                    ...this.paymentData,
                    id_billing: '',
                    amount: '',
                    proofBase64: '',
                    penerima: this.user.username
                };
                if (!selected) return;

                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (res.ok) {
                            this.unpaidBills = res.data || [];
                            this.refreshIcons();
                        } else {
                            this.notify(res.message, 'error');
                        }
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getUnpaidBills(selected.id_santri);
            },

            preparePaymentMenu() {
                this.paymentOutcome = null;
                if (!this.paymentData.id_santri) {
                    this.selectedSantri = null;
                    this.unpaidBills = [];
                    this.paymentData = {
                        id_santri: '',
                        id_billing: '',
                        amount: '',
                        method: this.paymentData.method || this.paymentMethodOptions[0] || 'Tunai',
                        proofBase64: '',
                        penerima: this.user.username
                    };
                }
            },

            openStudentProfile(santri, showLoading = true) {
                this.selectedSantri = santri;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) this.selectedStudentProfile = res.data;
                        else this.notify(res.message, 'error');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getStudentFinanceProfile(santri.id_santri);
            },

            openLatestInvoice(santri) {
                if (!santri) return;
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.selectedSantri = santri;
                        this.selectedStudentProfile = res.data;
                        const latestPayment = (res.data.transactions || [])
                            .filter(transaction => String(transaction.status || '').toUpperCase() === 'PAID')
                            .sort((a, b) => new Date(b.tanggal || 0).getTime() - new Date(a.tanggal || 0).getTime())[0];
                        if (!latestPayment) return this.notify('Belum ada pembayaran lunas untuk dibuatkan invoice.', 'error');
                        this.openInvoiceFromTransaction(latestPayment);
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getStudentFinanceProfile(santri.id_santri);
            },

            fetchArrears(force = false, showLoading = false) {
                if (!force && this.dataLoaded.arrears) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.arrearsList = res.data;
                            this.dataLoaded.arrears = true;
                            this.selectedClassFilter = '';
                        } else {
                            this.notify(res.message, 'error');
                        }
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getArrearsRecap();
            },

            fetchPaymentOrders(force = false, showLoading = false) {
                if (!force && this.dataLoaded.paymentOrders) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.paymentOrders = res.data;
                            this.dataLoaded.paymentOrders = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getPaymentOrders(50);
            },

            fetchExpenses(force = false, showLoading = false) {
                const needsList = force || !this.dataLoaded.expenseList;
                const needsCategories = force || !this.dataLoaded.expenseCategories;
                const needsProjects = force || !this.dataLoaded.developmentProjects;
                if (!needsList && !needsCategories && !needsProjects) return;
                const hasPrimaryRequest = needsList || needsProjects;
                if (showLoading) this.loading = true;
                if (needsList) {
                    google.script.run
                        .withSuccessHandler(res => {
                            if (showLoading) this.loading = false;
                            if (res.ok) {
                                this.expenseList = res.data;
                                this.dataLoaded.expenseList = true;
                            } else this.notify(res.message, 'error');
                            this.refreshIcons();
                        })
                        .withFailureHandler(err => this.handleFailure(err))
                        .getExpenses(100);
                }
                if (needsCategories) {
                    google.script.run
                        .withSuccessHandler(res => {
                            if (res.ok) {
                                this.expenseCategories = res.data;
                                this.dataLoaded.expenseCategories = true;
                            }
                            if (showLoading && !hasPrimaryRequest) this.loading = false;
                        })
                        .getExpenseCategories();
                }
                if (needsProjects) this.fetchDevelopmentProjects(force, showLoading);
            },

            fetchDonations(force = false, showLoading = false) {
                const needsList = force || !this.dataLoaded.donationList;
                const needsProjects = force || !this.dataLoaded.developmentProjects;
                if (!needsList && !needsProjects) return;
                if (showLoading) this.loading = true;
                if (needsList) {
                    google.script.run
                        .withSuccessHandler(res => {
                            if (showLoading) this.loading = false;
                            if (res.ok) {
                                this.donationList = res.data;
                                this.dataLoaded.donationList = true;
                            } else this.notify(res.message, 'error');
                            this.refreshIcons();
                        })
                        .withFailureHandler(err => this.handleFailure(err))
                        .getDonations(100);
                }
                if (needsProjects) this.fetchDevelopmentProjects(force, showLoading);
            },

            fetchCash(force = false, showLoading = false) {
                if (!force && this.dataLoaded.cashTransactions) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.cashTransactions = res.data;
                            this.dataLoaded.cashTransactions = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getCashTransactions(100);
            },

            fetchDevelopmentProjects(force = false, showLoading = false) {
                if (!force && this.dataLoaded.developmentProjects) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.developmentProjects = res.data;
                            this.dataLoaded.developmentProjects = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getDevelopmentProjects();
            },

            fetchOperationalReports(force = false, showLoading = false) {
                if (!force && this.dataLoaded.operationalReport) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.operationalReport = res.data;
                            this.dataLoaded.operationalReport = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getOperationalReportData();
            },

            fetchJournals(force = false, showLoading = false) {
                if (!force && this.dataLoaded.journalEntries) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.journalEntries = res.data;
                            this.dataLoaded.journalEntries = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getJournalSummaries(50);
            },

            fetchReports(force = false, showLoading = false) {
                if (!force && this.dataLoaded.reportData) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.reportData = res.data;
                            this.dataLoaded.reportData = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getAccountingReportData();
            },

            fetchActivityReport(force = false, showLoading = false) {
                const activityKey = `${this.activityFilter.month}-${this.activityFilter.year}`;
                if (!force && this.dataLoaded.activityReportKey === activityKey) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.activityReport = res.data;
                            this.dataLoaded.activityReportKey = activityKey;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getActivityReportData(this.activityFilter.month, this.activityFilter.year);
            },

            get uniqueClasses() {
                return [...new Set(this.santriList.map(item => item.kelas).filter(Boolean))].sort();
            },

            get activeSantriList() {
                return this.santriList.filter(item => String(item.status || '').trim().toLowerCase() === 'aktif');
            },

            get filteredSantriList() {
                const keyword = String(this.santriSearch || '').trim().toLowerCase();
                if (!keyword) return this.santriList;
                return this.santriList.filter(item => [
                    item.id_santri,
                    item.nama,
                    item.kelas,
                    item.status,
                    item.kontak_ortu
                ].some(value => String(value || '').toLowerCase().includes(keyword)));
            },

            get paymentMethodOptions() {
                const defaults = ['Tunai', 'Transfer Bank', 'QRIS', 'DANA', 'ShopeePay', 'GoPay'];
                const rawValue = String(this.settings.payment_methods || '').trim();
                const options = rawValue
                    ? rawValue.split(',').map(item => item.trim()).filter(Boolean)
                    : defaults;
                const deduped = [];
                options.forEach(option => {
                    if (!deduped.some(item => item.toLowerCase() === option.toLowerCase())) {
                        deduped.push(option);
                    }
                });
                return deduped.length ? deduped : defaults;
            },

            getFilteredArrears() {
                if (!this.selectedClassFilter) return this.arrearsList;
                return this.arrearsList.filter(a => a.kelas === this.selectedClassFilter);
            },

            getFilteredArrearsTotal() {
                return this.getFilteredArrears()
                    .reduce((sum, item) => sum + Number(item.remaining_amount || item.nominal || 0), 0);
            },

            getPartialArrearsCount() {
                return this.getFilteredArrears()
                    .filter(item => Number(item.paid_amount || 0) > 0)
                    .length;
            },

            getUniqueArrearsStudentCount() {
                return new Set(this.getFilteredArrears().map(item => item.id_santri || item.nama)).size;
            },

            getArrearsStudentRecap() {
                const grouped = {};
                this.getFilteredArrears().forEach(item => {
                    const key = item.id_santri || item.nama;
                    if (!grouped[key]) grouped[key] = { ...item, bills: [], total: 0 };
                    grouped[key].bills.push(item);
                    grouped[key].total += Number(item.remaining_amount || item.nominal || 0);
                });
                return Object.values(grouped).sort((a, b) => b.total - a.total);
            },

            openArrearsShare(student) {
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.arrearsSharePreview = res.data;
                        this.showArrearsShareModal = true;
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getArrearsWhatsAppPreview(student.id_santri);

            openArrearsShareLink() {

            printArrears() {

            },

            printArrearsStudent(student) {
                if (!student) return;
                this.arrearsPrintStudent = student;
                document.body.classList.add('print-arrears');
                window.setTimeout(() => window.print(), 50);

                    document.body.classList.remove('print-arrears');

            getArrearsPrintRecap() {

            handleAddSantri() {
                if(!this.newSantri.nama) return this.notify("Nama wajib diisi", "error");
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.showAddSantriModal = false;
                        this.notify(res.message);
                        this.invalidateData('santri', 'arrears');
                        if (this.view === 'santri') this.fetchSantri(true);
                        if (this.view === 'arrears') this.fetchArrears(true);
                        this.newSantri = { nama: '', kelas: '', kontak_ortu: '' };
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .addSantri(this.newSantri);
            },

            refreshAfterDataChange(...keys) {
                this.invalidateData(...keys, 'cashTransactions', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                this.fetchDashboard(true);
                if (this.view === 'santri') this.fetchSantri(true);
                if (this.view === 'arrears') this.fetchArrears(true);
                if (this.view === 'expenses') this.fetchExpenses(true);
                if (this.view === 'donations') this.fetchDonations(true);
                if (this.view === 'development') this.fetchDevelopmentProjects(true);
                if (this.view === 'payments') this.fetchPaymentOrders(true);
                if (this.view === 'cash') this.fetchCash(true);
                if (this.view === 'reports') this.fetchOperationalReports(true);
                if (this.view === 'journals') this.fetchJournals(true);
                if (this.view === 'accountingReports') this.fetchReports(true);
                if (this.selectedSantri) this.openStudentProfile(this.selectedSantri);
            },

            refreshDashboardSilently() {
                window.setTimeout(() => this.fetchDashboard(true), 0);
            },

            removeLocalItem(listName, keyName, keyValue) {
                const list = this[listName];
                if (!Array.isArray(list)) return;
                this[listName] = list.filter(item => String(item?.[keyName]) !== String(keyValue));
            },

            promptText(label, currentValue = '') {
                const value = prompt(label, currentValue || '');
                return value === null ? null : value.trim();
            },

            promptNumber(label, currentValue = '') {
                const value = prompt(label, currentValue || '');
                if (value === null) return null;
                const parsed = Number(value);
                if (!parsed || parsed <= 0) {
                    this.notify("Nominal wajib lebih dari nol", "error");
                    return null;
                }
                return parsed;
            },

            editSantri(santri) {
                const nama = this.promptText("Nama santri", santri.nama);
                if (nama === null) return;
                const kelas = this.promptText("Kelas", santri.kelas);
                if (kelas === null) return;
                const status = this.promptText("Status (Aktif/Nonaktif)", santri.status || 'Aktif');
                if (status === null) return;
                const kontak = this.promptText("Kontak orang tua", santri.kontak_ortu);
                if (kontak === null) return;

                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.refreshAfterDataChange('santri', 'arrears');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .updateSantri(santri.id_santri, { nama, kelas, status, kontak_ortu: kontak });
            },

            deleteSantriData(santri) {
                if (!confirm(`Hapus/nonaktifkan santri ${santri.nama}?`)) return;
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        if (this.selectedSantri?.id_santri === santri.id_santri) {
                            this.selectedSantri = null;
                            this.selectedStudentProfile = null;
                        }
                        this.removeLocalItem('santriList', 'id_santri', santri.id_santri);
                        this.removeLocalItem('arrearsList', 'id_santri', santri.id_santri);
                        this.refreshDashboardSilently();
                        this.invalidateData('santri', 'arrears');
                    })
                    .withFailureHandler(err => this.handleFailure(err))

            },

            openPaymentModal(santri) {

                    id_santri: santri.id_santri,

                    method: this.paymentMethodOptions[0] || 'Tunai',

                };

            closePaymentModal() {

                this.paymentOutcome = null;
            },

            closeInvoiceModal() {
                this.showInvoiceModal = false;

            },

            openInvoice(invoice) {

                    ...invoice,

            openInvoiceFromTransaction(transaction) {

                this.openInvoice({

                    payment_id: transaction.id_transaksi,
                    issued_at: transaction.tanggal,

                    logo_url: this.settings.logo_url || '',
                    student_name: student.nama || '-',
                    student_class: student.kelas || '-',
                    billing_label: transaction.billing_label || `${bill.bulan || ''} ${bill.tahun || ''}`.trim() || transaction.id_billing || '-',
                    billing_id: transaction.id_billing || '-',
                    amount: Number(transaction.jumlah_bayar || 0),
                    total_amount: Number(bill.nominal || transaction.jumlah_bayar || 0),
                    remaining_amount: Number(bill.remaining_amount || 0),
                    status: Number(bill.remaining_amount || 0) <= 0 ? 'LUNAS' : 'PEMBAYARAN SEBAGIAN',
