<script>
    const INITIAL_APP_SETTINGS = <?!= initialSettingsJson ?>;

    function app() {
        return {
            isLoggedIn: false,
            appReady: false,
            loading: false,
            bootstrapping: false,
            mobileMenuOpen: false,
            showAdvancedAccounting: false,
            toasts: [],
            view: 'dashboard',
            user: {},
            auth: { username: '', password: '' },
            stats: { cashBalance: 0, incomeThisMonth: 0, expenseThisMonth: 0, totalArrears: 0, donationThisMonth: 0, activeSantriCount: 0 },
            dashboardData: { incomeVsExpense: [], topExpenses: [], unpaidBills: [] },
            settings: { school_name: '', logo_url: '', payment_methods: '', ...INITIAL_APP_SETTINGS },
            dataLoaded: {
                santri: false,
                arrears: false,
                paymentOrders: false,
                expenseList: false,
                expenseCategories: false,
                donationList: false,
                cashTransactions: false,
                developmentProjects: false,
                operationalReport: false,
                journalEntries: false,
                reportData: false,
                activityReportKey: ''
            },
            santriList: [],
            santriSearch: '',
            selectedStudentProfile: null,
            arrearsList: [],
            journalEntries: [],
            paymentOrders: [],
            expenseCategories: [],
            expenseList: [],
            donationList: [],
            cashTransactions: [],
            developmentProjects: [],
            operationalReport: {
                spp: { total: 0, paid: 0, unpaid: 0, paidAmount: 0, unpaidAmount: 0, paidPercentage: 0 },
                donations: { totalReceived: 0, pledged: 0, topDonors: [] },
                expenses: { total: 0, byCategory: [] },
                cash: { totalIn: 0, totalOut: 0, balance: 0, ledger: [] }
            },
            activityFilter: { month: ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'][new Date().getMonth()], year: new Date().getFullYear() },
            activityReport: {
                period: { month: '', year: '', label: '' },
                summary: { totalIncome: 0, totalExpense: 0, surplusDeficit: 0, isSurplus: true, surplusLabel: 'Surplus' },
                incomeByAccount: [],
                expenseByAccount: [],
                journalCount: 0,
                note: ''
            },
            reportData: {
                summary: { totalDebit: 0, totalCredit: 0, isBalanced: true, cashBank: 0, sppReceivable: 0 },
                trialBalance: [],
                netAssetSummary: [],
                financialPosition: { totalAssets: 0, totalLiabilities: 0, totalNetAssets: 0 },
                cashFlow: { operasi: 0, investasi: 0, pendanaan: 0, total: 0 },
                notes: { materialAccounts: [] }
            },
            selectedClassFilter: '',
            unpaidBills: [],
            showAddSantriModal: false,
            showPaymentModal: false,
            showQrisModal: false,
            selectedSantri: null,
            newSantri: { nama: '', kelas: '', kontak_ortu: '' },
            genBill: { month: 'Januari', year: new Date().getFullYear(), nominal: 500000, targetMode: 'ALL', classFilter: '', studentFilter: '' },
            paymentData: { id_santri: '', id_billing: '', amount: 0, method: 'Tunai', proofBase64: '', penerima: '' },
            qrisData: { student_name: '', billing_label: '', amount: 0, qr_text: '', note: '' },
            newExpense: { date: new Date().toISOString().slice(0, 10), category: 'Dapur', amount: '', supplier: '', method: 'Tunai', description: '', proofBase64: '', project_id: '' },
            newDonation: { date: new Date().toISOString().slice(0, 10), donor_name: '', phone: '', type: 'Donasi', status: 'Masuk', amount: '', method: 'Transfer', description: '', proofBase64: '', project_id: '' },
            newProject: { name: '', target_budget: '', description: '', status: 'Aktif', start_date: new Date().toISOString().slice(0, 10), end_date: '' },

            init() {
                const savedUser = localStorage.getItem('spp_user');
                if (savedUser) {
                    this.user = JSON.parse(savedUser);
                    this.isLoggedIn = true;
                    this.bootstrapping = true;
                    this.loadInitialAppData();
                } else {
                    window.requestAnimationFrame(() => {
                        this.appReady = true;
                        this.hideInitialSplash();
                    });
                }

                this.refreshIcons();
            },

            refreshIcons() {
                this.$nextTick(() => { lucide.createIcons(); });
            },

            hideInitialSplash() {
                const splash = document.getElementById('initial-splash');
                if (splash) splash.classList.add('is-hidden');
            },

            finishInitialLoad() {
                this.bootstrapping = false;
                this.appReady = true;
                this.hideInitialSplash();
                this.refreshIcons();
            },

            loadInitialAppData() {
                google.script.run
                    .withSuccessHandler(res => {
                        if (res.ok) {
                            const bootstrap = res.data || {};
                            if (bootstrap.dashboard) {
                                this.stats = bootstrap.dashboard.stats || this.stats;
                                this.dashboardData = bootstrap.dashboard;
                            }
                            if (Array.isArray(bootstrap.developmentProjects)) {
                                this.developmentProjects = bootstrap.developmentProjects;
                                this.dataLoaded.developmentProjects = true;
                            }
                            if (Array.isArray(bootstrap.expenseCategories)) {
                                this.expenseCategories = bootstrap.expenseCategories;
                                this.dataLoaded.expenseCategories = true;
                            }
                        } else {
                            this.notify(res.message, 'error');
                        }
                        this.finishInitialLoad();
                    })
                    .withFailureHandler(err => {
                        this.handleFailure(err);
                        this.finishInitialLoad();
                    })
                    .getBootstrapData();
            },

            invalidateData(...keys) {
                keys.forEach(key => {
                    if (key === 'activityReport') {
                        this.dataLoaded.activityReportKey = '';
                        return;
                    }
                    if (Object.prototype.hasOwnProperty.call(this.dataLoaded, key)) {
                        this.dataLoaded[key] = false;
                    }
                });
            },

            fetchSettings() {
                google.script.run
                    .withSuccessHandler(res => { if(res.ok) this.settings = { ...this.settings, ...res.data }; })
                    .getAppSettings();
            },

            notify(message, type = 'success') {
                const id = Date.now();
                this.toasts.push({ id, message, type, show: true });
                setTimeout(() => {
                    const toast = this.toasts.find(t => t.id === id);
                    if (toast) toast.show = false;
                }, 3000);
            },

            handleLogin() {
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        this.refreshIcons();
                        if (res.ok) {
                            this.isLoggedIn = true;
                            this.user = res.user;
                            localStorage.setItem('spp_user', JSON.stringify(res.user));
                            this.notify("Selamat datang kembali!");
                            this.bootstrapping = true;
                            this.loadInitialAppData();
                        } else {
                            this.notify(res.message, 'error');
                        }
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .login(this.auth.username, this.auth.password);
            },

            handleFailure(err) {
                this.loading = false;
                this.notify(err.message || err.toString(), 'error');
            },

            fetchDashboard() {
                google.script.run
                    .withSuccessHandler(res => {
                        if (res.ok) {
                            this.stats = res.data.stats;
                            this.dashboardData = res.data;
                        }
                    })
                    .getDashboardData();
            },

            fetchSantri(force = false, showLoading = false) {
                if (!force && this.dataLoaded.santri) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.santriList = res.data;
                            this.dataLoaded.santri = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getSantriList();
            },

            openStudentProfile(santri) {
                this.selectedSantri = santri;
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (res.ok) this.selectedStudentProfile = res.data;
                        else this.notify(res.message, 'error');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getStudentFinanceProfile(santri.id_santri);
            },

            fetchArrears(force = false, showLoading = false) {
                if (!force && this.dataLoaded.arrears) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.arrearsList = res.data;
                            this.dataLoaded.arrears = true;
                            this.selectedClassFilter = '';
                        } else {
                            this.notify(res.message, 'error');
                        }
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getArrearsRecap();
            },

            fetchPaymentOrders(force = false, showLoading = false) {
                if (!force && this.dataLoaded.paymentOrders) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.paymentOrders = res.data;
                            this.dataLoaded.paymentOrders = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getPaymentOrders(50);
            },

            fetchExpenses(force = false, showLoading = false) {
                const needsList = force || !this.dataLoaded.expenseList;
                const needsCategories = force || !this.dataLoaded.expenseCategories;
                const needsProjects = force || !this.dataLoaded.developmentProjects;
                if (!needsList && !needsCategories && !needsProjects) return;
                const hasPrimaryRequest = needsList || needsProjects;
                if (showLoading) this.loading = true;
                if (needsList) {
                    google.script.run
                        .withSuccessHandler(res => {
                            if (showLoading) this.loading = false;
                            if (res.ok) {
                                this.expenseList = res.data;
                                this.dataLoaded.expenseList = true;
                            } else this.notify(res.message, 'error');
                            this.refreshIcons();
                        })
                        .withFailureHandler(err => this.handleFailure(err))
                        .getExpenses(100);
                }
                if (needsCategories) {
                    google.script.run
                        .withSuccessHandler(res => {
                            if (res.ok) {
                                this.expenseCategories = res.data;
                                this.dataLoaded.expenseCategories = true;
                            }
                            if (showLoading && !hasPrimaryRequest) this.loading = false;
                        })
                        .getExpenseCategories();
                }
                if (needsProjects) this.fetchDevelopmentProjects(force, showLoading);
            },

            fetchDonations(force = false, showLoading = false) {
                const needsList = force || !this.dataLoaded.donationList;
                const needsProjects = force || !this.dataLoaded.developmentProjects;
                if (!needsList && !needsProjects) return;
                if (showLoading) this.loading = true;
                if (needsList) {
                    google.script.run
                        .withSuccessHandler(res => {
                            if (showLoading) this.loading = false;
                            if (res.ok) {
                                this.donationList = res.data;
                                this.dataLoaded.donationList = true;
                            } else this.notify(res.message, 'error');
                            this.refreshIcons();
                        })
                        .withFailureHandler(err => this.handleFailure(err))
                        .getDonations(100);
                }
                if (needsProjects) this.fetchDevelopmentProjects(force, showLoading);
            },

            fetchCash(force = false, showLoading = false) {
                if (!force && this.dataLoaded.cashTransactions) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.cashTransactions = res.data;
                            this.dataLoaded.cashTransactions = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getCashTransactions(100);
            },

            fetchDevelopmentProjects(force = false, showLoading = false) {
                if (!force && this.dataLoaded.developmentProjects) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.developmentProjects = res.data;
                            this.dataLoaded.developmentProjects = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getDevelopmentProjects();
            },

            fetchOperationalReports(force = false, showLoading = false) {
                if (!force && this.dataLoaded.operationalReport) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.operationalReport = res.data;
                            this.dataLoaded.operationalReport = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getOperationalReportData();
            },

            fetchJournals(force = false, showLoading = false) {
                if (!force && this.dataLoaded.journalEntries) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.journalEntries = res.data;
                            this.dataLoaded.journalEntries = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getJournalSummaries(50);
            },

            fetchReports(force = false, showLoading = false) {
                if (!force && this.dataLoaded.reportData) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.reportData = res.data;
                            this.dataLoaded.reportData = true;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getAccountingReportData();
            },

            fetchActivityReport(force = false, showLoading = false) {
                const activityKey = `${this.activityFilter.month}-${this.activityFilter.year}`;
                if (!force && this.dataLoaded.activityReportKey === activityKey) return;
                if (showLoading) this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (showLoading) this.loading = false;
                        if (res.ok) {
                            this.activityReport = res.data;
                            this.dataLoaded.activityReportKey = activityKey;
                        }
                        else this.notify(res.message, 'error');
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getActivityReportData(this.activityFilter.month, this.activityFilter.year);
            },

            get uniqueClasses() {
                return [...new Set(this.santriList.map(item => item.kelas).filter(Boolean))].sort();
            },

            get activeSantriList() {
                return this.santriList.filter(item => String(item.status || '').trim().toLowerCase() === 'aktif');
            },

            get filteredSantriList() {
                const keyword = String(this.santriSearch || '').trim().toLowerCase();
                if (!keyword) return this.santriList;
                return this.santriList.filter(item => [
                    item.id_santri,
                    item.nama,
                    item.kelas,
                    item.status,
                    item.kontak_ortu
                ].some(value => String(value || '').toLowerCase().includes(keyword)));
            },

            get paymentMethodOptions() {
                const defaults = ['Tunai', 'Transfer Bank', 'QRIS', 'DANA', 'ShopeePay', 'GoPay'];
                const rawValue = String(this.settings.payment_methods || '').trim();
                const options = rawValue
                    ? rawValue.split(',').map(item => item.trim()).filter(Boolean)
                    : defaults;
                const deduped = [];
                options.forEach(option => {
                    if (!deduped.some(item => item.toLowerCase() === option.toLowerCase())) {
                        deduped.push(option);
                    }
                });
                return deduped.length ? deduped : defaults;
            },

            getFilteredArrears() {
                if (!this.selectedClassFilter) return this.arrearsList;
                return this.arrearsList.filter(a => a.kelas === this.selectedClassFilter);
            },

            handleAddSantri() {
                if(!this.newSantri.nama) return this.notify("Nama wajib diisi", "error");
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.showAddSantriModal = false;
                        this.notify(res.message);
                        this.invalidateData('santri', 'arrears');
                        if (this.view === 'santri') this.fetchSantri(true);
                        if (this.view === 'arrears') this.fetchArrears(true);
                        this.newSantri = { nama: '', kelas: '', kontak_ortu: '' };
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .addSantri(this.newSantri);
            },

            refreshAfterDataChange(...keys) {
                this.invalidateData(...keys, 'cashTransactions', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                this.fetchDashboard();
                if (this.view === 'santri') this.fetchSantri(true);
                if (this.view === 'arrears') this.fetchArrears(true);
                if (this.view === 'expenses') this.fetchExpenses(true);
                if (this.view === 'donations') this.fetchDonations(true);
                if (this.view === 'development') this.fetchDevelopmentProjects(true);
                if (this.view === 'payments') this.fetchPaymentOrders(true);
                if (this.view === 'cash') this.fetchCash(true);
                if (this.view === 'reports') this.fetchOperationalReports(true);
                if (this.view === 'journals') this.fetchJournals(true);
                if (this.view === 'accountingReports') this.fetchReports(true);
                if (this.selectedSantri) this.openStudentProfile(this.selectedSantri);
            },

            refreshDashboardSilently() {
                window.setTimeout(() => this.fetchDashboard(), 0);
            },

            removeLocalItem(listName, keyName, keyValue) {
                const list = this[listName];
                if (!Array.isArray(list)) return;
                this[listName] = list.filter(item => String(item?.[keyName]) !== String(keyValue));
            },

            promptText(label, currentValue = '') {
                const value = prompt(label, currentValue || '');
                return value === null ? null : value.trim();
            },

            promptNumber(label, currentValue = '') {
                const value = prompt(label, currentValue || '');
                if (value === null) return null;
                const parsed = Number(value);
                if (!parsed || parsed <= 0) {
                    this.notify("Nominal wajib lebih dari nol", "error");
                    return null;
                }
                return parsed;
            },

            editSantri(santri) {
                const nama = this.promptText("Nama santri", santri.nama);
                if (nama === null) return;
                const kelas = this.promptText("Kelas", santri.kelas);
                if (kelas === null) return;
                const status = this.promptText("Status (Aktif/Nonaktif)", santri.status || 'Aktif');
                if (status === null) return;
                const kontak = this.promptText("Kontak orang tua", santri.kontak_ortu);
                if (kontak === null) return;

                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.refreshAfterDataChange('santri', 'arrears');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .updateSantri(santri.id_santri, { nama, kelas, status, kontak_ortu: kontak });
            },

            deleteSantriData(santri) {
                if (!confirm(`Hapus/nonaktifkan santri ${santri.nama}?`)) return;
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        if (this.selectedSantri?.id_santri === santri.id_santri) {
                            this.selectedSantri = null;
                            this.selectedStudentProfile = null;
                        }
                        this.removeLocalItem('santriList', 'id_santri', santri.id_santri);
                        this.removeLocalItem('arrearsList', 'id_santri', santri.id_santri);
                        this.refreshDashboardSilently();
                        this.invalidateData('santri', 'arrears');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .deleteSantri(santri.id_santri);
            },

            openPaymentModal(santri) {
                this.selectedSantri = santri;
                this.paymentData = {
                    id_santri: santri.id_santri,
                    id_billing: '',
                    amount: '',
                    method: this.paymentMethodOptions[0] || 'Tunai',
                    proofBase64: '',
                    penerima: this.user.username
                };
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        this.unpaidBills = res.data;
                        this.showPaymentModal = true;
                        this.refreshIcons();
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .getUnpaidBills(santri.id_santri);
            },

            setPaymentAmountFromSelectedBill() {
                const bill = this.unpaidBills.find(b => b.id_billing === this.paymentData.id_billing);
                this.paymentData.amount = bill ? (bill.remaining_amount || bill.nominal) : '';
            },

            handleFileUpload(e, target, field = 'proofBase64') {
                const file = e.target.files[0];
                if(!file) return;
                const reader = new FileReader();
                reader.onload = (f) => { target[field] = f.target.result; };
                reader.readAsDataURL(file);
            },

            handleProcessPayment() {
                if(!this.paymentData.id_billing) return this.notify("Pilih tagihan!", "error");
                const bill = this.unpaidBills.find(b => b.id_billing === this.paymentData.id_billing);
                if(!bill) return this.notify("Tagihan tidak ditemukan", "error");
                const paymentAmount = Number(this.paymentData.amount);
                const remainingAmount = Number(bill.remaining_amount || bill.nominal);
                if (!paymentAmount || paymentAmount <= 0) return this.notify("Nominal pembayaran wajib lebih dari nol", "error");
                if (paymentAmount > remainingAmount) return this.notify("Nominal pembayaran melebihi sisa tagihan", "error");

                const runner = google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (res.ok) {
                            if (this.paymentData.method === 'QRIS') {
                                this.qrisData = res.data || this.qrisData;
                                this.showPaymentModal = false;
                                this.showQrisModal = true;
                                this.renderQrisCode();
                                this.notify('QRIS dinamis berhasil dibuat');
                                return;
                            }

                            this.notify(res.message || "Pembayaran berhasil dicatat");
                            this.showPaymentModal = false;
                            this.invalidateData('paymentOrders', 'cashTransactions', 'arrears', 'santri', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                            this.fetchDashboard();
                            if (this.view === 'payments') this.fetchPaymentOrders(true);
                            if (this.view === 'santri') this.fetchSantri(true);
                            if (this.view === 'arrears') this.fetchArrears(true);
                            if (this.view === 'cash') this.fetchCash(true);
                            if (this.view === 'reports') this.fetchOperationalReports(true);
                            if (this.view === 'journals') this.fetchJournals(true);
                            if (this.view === 'accountingReports') this.fetchReports(true);
                        } else {
                            this.notify(res.message, 'error');
                        }
                    })
                    .withFailureHandler(err => this.handleFailure(err));

                if (this.paymentData.method === 'QRIS') {
                    runner.generateDynamicQrisForBilling(this.paymentData.id_billing);
                } else {
                    this.loading = true;
                    runner.recordDirectPayment(this.paymentData);
                }
            },

            editBillingData(billing) {
                const bulan = this.promptText("Bulan tagihan", billing.bulan);
                if (bulan === null) return;
                const tahun = this.promptText("Tahun tagihan", billing.tahun);
                if (tahun === null) return;
                const nominal = this.promptNumber("Nominal tagihan", billing.nominal);
                if (nominal === null) return;
                const description = this.promptText("Keterangan", billing.description || `Tagihan SPP ${bulan} ${tahun}`);
                if (description === null) return;

                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.refreshAfterDataChange('arrears');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .updateBilling(billing.id_billing, { bulan, tahun, nominal, description });
            },

            deleteBillingData(billing) {
                if (!confirm(`Hapus tagihan ${billing.nama} ${billing.bulan} ${billing.tahun}?`)) return;
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.removeLocalItem('arrearsList', 'id_billing', billing.id_billing);
                        if (this.selectedStudentProfile?.bills) {
                            this.selectedStudentProfile.bills = this.selectedStudentProfile.bills.filter(item => String(item.id_billing) !== String(billing.id_billing));
                            this.selectedStudentProfile.totalArrears = this.selectedStudentProfile.bills
                                .filter(item => item.payment_status !== 'Lunas')
                                .reduce((sum, item) => sum + Number(item.remaining_amount || item.nominal || 0), 0);
                        }
                        this.refreshDashboardSilently();
                        this.invalidateData('arrears', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .deleteBilling(billing.id_billing);
            },

            handleGenerateBills() {
                const amount = Number(this.genBill.nominal);
                if (!this.genBill.month || !this.genBill.year || !amount || amount <= 0) {
                    return this.notify("Bulan, tahun, dan nominal wajib diisi", "error");
                }
                if (this.genBill.targetMode === 'STUDENT' && !this.genBill.studentFilter) {
                    return this.notify("Pilih nama santri dulu", "error");
                }
                if (this.genBill.targetMode === 'CLASS' && !this.genBill.classFilter) {
                    return this.notify("Pilih kelas dulu", "error");
                }
                const targetLabel = this.genBill.targetMode === 'STUDENT'
                    ? (this.activeSantriList.find(s => s.id_santri === this.genBill.studentFilter)?.nama || 'santri terpilih')
                    : this.genBill.targetMode === 'CLASS'
                        ? `kelas ${this.genBill.classFilter}`
                        : 'semua santri aktif';
                if(!confirm(`Generate tagihan SPP untuk ${targetLabel}?`)) return this.notify("Konfirmasi diperlukan", "error");
                this.loading = true;
                const classFilter = this.genBill.targetMode === 'CLASS' ? this.genBill.classFilter : 'ALL';
                const studentFilter = this.genBill.targetMode === 'STUDENT' ? this.genBill.studentFilter : '';
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.invalidateData('arrears', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                        this.view = 'arrears';
                        this.fetchDashboard();
                        this.fetchArrears(true);
                        if (this.view === 'reports') this.fetchOperationalReports(true);
                        if (this.view === 'journals') this.fetchJournals(true);
                        if (this.view === 'accountingReports') this.fetchReports(true);
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .generateMonthlyBills(this.genBill.month, this.genBill.year, this.genBill.nominal, classFilter, studentFilter);
            },

            renderQrisCode() {
                this.$nextTick(() => {
                    const container = document.getElementById('qris-code');
                    if (!container) return;
                    container.innerHTML = '';
                    if (!this.qrisData.qr_text) {
                        const note = this.qrisData.note || 'Memuat QRIS dinamis...';
                        container.innerHTML = `<div class="text-center py-8 px-4"><div class="w-8 h-8 border-4 border-[#dbe5ef] border-t-primary rounded-full animate-spin mx-auto mb-3"></div><p class="text-sm ${note.startsWith('Gagal') ? 'text-danger' : 'text-slate-500'}">${note}</p></div>`;
                        return;
                    }
                    if (window.QRCode) {
                        new QRCode(container, {
                            text: this.qrisData.qr_text,
                            width: 240,
                            height: 240,
                            colorDark: '#111827',
                            colorLight: '#ffffff',
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } else {
                        container.textContent = this.qrisData.qr_text;
                    }
                });
            },

            openQrisModal(santri) {
                if (!santri) return;
                this.qrisData = { student_name: santri.nama || '', billing_label: '', amount: 0, qr_text: '', note: 'Memuat QRIS dinamis...' };
                this.showQrisModal = true;
                google.script.run
                    .withSuccessHandler(res => {
                        if (!res.ok) {
                            this.qrisData.note = `Gagal: ${res.message}`;
                            this.qrisData.qr_text = '';
                            this.renderQrisCode();
                            this.notify(res.message, 'error');
                            return;
                        }
                        this.qrisData = res.data || this.qrisData;
                        this.renderQrisCode();
                    })
                    .withFailureHandler(err => {
                        this.qrisData.note = `Gagal: ${err?.message || err?.toString?.() || 'QRIS tidak dapat dibuat'}`;
                        this.qrisData.qr_text = '';
                        this.renderQrisCode();
                        this.handleFailure(err);
                    })
                    .generateDynamicQrisForSantri(santri.id_santri);
            },

            closeQrisModal() {
                this.showQrisModal = false;
                this.qrisData = { student_name: '', billing_label: '', amount: 0, qr_text: '', note: '' };
            },

            copyQrisPayload() {
                if (!this.qrisData.qr_text) return this.notify("QR belum tersedia", "error");
                navigator.clipboard.writeText(this.qrisData.qr_text)
                    .then(() => this.notify("Payload QRIS disalin"))
                    .catch(() => this.notify("Gagal menyalin payload", "error"));
            },

            handleAddExpense() {
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (res.ok) {
                            this.notify(res.message);
                            this.newExpense = { date: new Date().toISOString().slice(0, 10), category: 'Dapur', amount: '', supplier: '', method: 'Tunai', description: '', proofBase64: '', project_id: '' };
                            this.invalidateData('expenseList', 'expenseCategories', 'cashTransactions', 'developmentProjects', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                            this.fetchDashboard();
                            if (this.view === 'expenses') this.fetchExpenses(true);
                            if (this.view === 'cash') this.fetchCash(true);
                            if (this.view === 'development') this.fetchDevelopmentProjects(true);
                            if (this.view === 'reports') this.fetchOperationalReports(true);
                            if (this.view === 'journals') this.fetchJournals(true);
                            if (this.view === 'accountingReports') this.fetchReports(true);
                        } else this.notify(res.message, 'error');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .addExpense({ ...this.newExpense, created_by: this.user.username });
            },

            editExpenseData(expense) {
                const amount = this.promptNumber("Nominal pengeluaran", expense.amount);
                if (amount === null) return;
                const category = this.promptText("Kategori", expense.category);
                if (category === null) return;
                const supplier = this.promptText("Supplier / penerima", expense.supplier);
                if (supplier === null) return;
                const method = this.promptText("Metode", expense.method || 'Tunai');
                if (method === null) return;
                const description = this.promptText("Keterangan", expense.description);
                if (description === null) return;

                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.refreshAfterDataChange('expenseList', 'developmentProjects');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .updateExpense(expense.expense_id, { ...expense, amount, category, supplier, method, description });
            },

            deleteExpenseData(expense) {
                if (!confirm(`Hapus pengeluaran ${expense.category}?`)) return;
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.removeLocalItem('expenseList', 'expense_id', expense.expense_id);
                        this.refreshDashboardSilently();
                        this.invalidateData('expenseList', 'developmentProjects', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .deleteExpense(expense.expense_id);
            },

            handleAddDonation() {
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (res.ok) {
                            this.notify(res.message);
                            this.newDonation = { date: new Date().toISOString().slice(0, 10), donor_name: '', phone: '', type: 'Donasi', status: 'Masuk', amount: '', method: 'Transfer', description: '', proofBase64: '', project_id: '' };
                            this.invalidateData('donationList', 'cashTransactions', 'developmentProjects', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                            this.fetchDashboard();
                            if (this.view === 'donations') this.fetchDonations(true);
                            if (this.view === 'cash') this.fetchCash(true);
                            if (this.view === 'development') this.fetchDevelopmentProjects(true);
                            if (this.view === 'reports') this.fetchOperationalReports(true);
                            if (this.view === 'journals') this.fetchJournals(true);
                            if (this.view === 'accountingReports') this.fetchReports(true);
                        } else this.notify(res.message, 'error');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .addDonation({ ...this.newDonation, created_by: this.user.username });
            },

            editDonationData(donation) {
                const amount = this.promptNumber("Nominal donasi", donation.amount);
                if (amount === null) return;
                const donorName = this.promptText("Nama donatur", donation.donor_name);
                if (donorName === null) return;
                const type = this.promptText("Jenis", donation.type || 'Donasi');
                if (type === null) return;
                const status = this.promptText("Status (Masuk/Janji)", donation.status || 'Masuk');
                if (status === null) return;
                const method = this.promptText("Metode", donation.method || 'Transfer');
                if (method === null) return;
                const description = this.promptText("Keterangan", donation.description);
                if (description === null) return;

                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.refreshAfterDataChange('donationList', 'developmentProjects');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .updateDonation(donation.donation_id, { ...donation, amount, donor_name: donorName, type, status, method, description });
            },

            deleteDonationData(donation) {
                if (!confirm(`Hapus donasi dari ${donation.donor_name}?`)) return;
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.removeLocalItem('donationList', 'donation_id', donation.donation_id);
                        this.refreshDashboardSilently();
                        this.invalidateData('donationList', 'developmentProjects', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .deleteDonation(donation.donation_id);
            },

            handleAddProject() {
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (res.ok) {
                            this.notify(res.message);
                            this.newProject = { name: '', target_budget: '', description: '', status: 'Aktif', start_date: new Date().toISOString().slice(0, 10), end_date: '' };
                            this.invalidateData('developmentProjects');
                            this.fetchDevelopmentProjects(true);
                            if (this.view === 'expenses') this.fetchExpenses(true);
                            if (this.view === 'donations') this.fetchDonations(true);
                        } else this.notify(res.message, 'error');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .addDevelopmentProject({ ...this.newProject, created_by: this.user.username });
            },

            editProjectData(project) {
                const name = this.promptText("Nama proyek", project.name);
                if (name === null) return;
                const targetBudget = this.promptNumber("Target anggaran", project.target_budget);
                if (targetBudget === null) return;
                const status = this.promptText("Status", project.status || 'Aktif');
                if (status === null) return;
                const description = this.promptText("Keterangan", project.description);
                if (description === null) return;

                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.refreshAfterDataChange('developmentProjects');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .updateDevelopmentProject(project.project_id, { ...project, name, target_budget: targetBudget, status, description });
            },

            deleteProjectData(project) {
                if (!confirm(`Hapus proyek ${project.name}?`)) return;
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.removeLocalItem('developmentProjects', 'project_id', project.project_id);
                        this.refreshDashboardSilently();
                        this.invalidateData('developmentProjects', 'expenseList', 'donationList', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .deleteDevelopmentProject(project.project_id);
            },

            editPaymentData(transaction) {
                const amount = this.promptNumber("Nominal pembayaran", transaction.jumlah_bayar);
                if (amount === null) return;
                const method = this.promptText("Metode", transaction.metode || 'Tunai');
                if (method === null) return;

                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.refreshAfterDataChange('arrears', 'paymentOrders');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .updatePayment(transaction.id_transaksi, { amount, method, penerima: this.user.username });
            },

            deletePaymentData(transaction) {
                if (!confirm(`Hapus/batalkan pembayaran ${transaction.id_transaksi}?`)) return;
                this.loading = true;
                google.script.run
                    .withSuccessHandler(res => {
                        this.loading = false;
                        if (!res.ok) return this.notify(res.message, 'error');
                        this.notify(res.message);
                        this.removeLocalItem('paymentOrders', 'order_id', transaction.id_transaksi);
                        if (this.selectedStudentProfile?.transactions) {
                            this.selectedStudentProfile.transactions = this.selectedStudentProfile.transactions.filter(item => String(item.id_transaksi) !== String(transaction.id_transaksi));
                        }
                        this.refreshDashboardSilently();
                        this.invalidateData('arrears', 'paymentOrders', 'cashTransactions', 'operationalReport', 'reportData', 'journalEntries', 'activityReport');
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .deletePayment(transaction.id_transaksi);
            },

            saveSetting(key, value) {
                this.loading = true;
                google.script.run
                    .withSuccessHandler(() => {
                        this.loading = false;
                        this.notify("Pengaturan disimpan");
                    })
                    .withFailureHandler(err => this.handleFailure(err))
                    .updateAppSetting(key, value);
            },

            handleLogoUpload(e) {
                const file = e.target.files[0];
                if (!file) return;
                this.loading = true;
                const reader = new FileReader();
                reader.onload = (f) => {
                    google.script.run
                        .withSuccessHandler(res => {
                            this.loading = false;
                            this.settings.logo_url = res.url;
                            this.notify("Logo berhasil diperbarui");
                            this.refreshIcons();
                        })
                        .withFailureHandler(err => this.handleFailure(err))
                        .saveSchoolLogo(f.target.result);
                };
                reader.readAsDataURL(file);
            },

            openView(viewName) {
                this.view = viewName;
                this.mobileMenuOpen = false;
                if (viewName === 'santri') this.fetchSantri(false, false);
                if (viewName === 'billing') this.fetchSantri(false, false);
                if (viewName === 'arrears') this.fetchArrears(false, false);
                if (viewName === 'payments') this.fetchPaymentOrders(false, false);
                if (viewName === 'expenses') this.fetchExpenses(false, false);
                if (viewName === 'donations') this.fetchDonations(false, false);
                if (viewName === 'cash') {
                    this.fetchCash(false, false);
                    this.fetchOperationalReports(false, false);
                }
                if (viewName === 'development') this.fetchDevelopmentProjects(false, false);
                if (viewName === 'reports') {
                    this.fetchOperationalReports(false, false);
                    this.fetchActivityReport(false, false);
                }
                if (viewName === 'journals') this.fetchJournals(false, false);
                if (viewName === 'accountingReports') this.fetchReports(false, false);
                this.refreshIcons();
            },

            viewTitle() {
                const titles = {
                    dashboard: 'Dashboard',
                    santri: 'Data Santri',
                    billing: 'Tagihan SPP',
                    payments: 'Pembayaran',
                    arrears: 'Tunggakan',
                    expenses: 'Pengeluaran',
                    donations: 'Donasi',
                    cash: 'Kas',
                    development: 'Dana Pembangunan',
                    reports: 'Laporan Ringkas',
                    journals: 'Jurnal',
                    accountingReports: 'Laporan Akuntansi',
                    settings: 'Pengaturan'
                };
                return titles[this.view] || 'Keuangan Pondok';
            },

            formatCurrency(val) {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR' }).format(val || 0);
            },

            formatDate(val) {
                if (!val) return '-';
                return new Intl.DateTimeFormat('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }).format(new Date(val));
            },

            logout() {
                localStorage.removeItem('spp_user');
                this.isLoggedIn = false;
                this.user = {};
                this.auth = { username: '', password: '' };
                this.bootstrapping = false;
                this.appReady = false;
                this.hideInitialSplash();
                this.refreshIcons();
                this.notify("Anda telah keluar");
                window.requestAnimationFrame(() => {
                    this.appReady = true;
                });
            },
        }
    }
</script>
