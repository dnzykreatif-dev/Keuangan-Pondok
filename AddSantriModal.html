<!-- Add Santri Modal -->
<div x-show="showAddSantriModal" x-cloak class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-center justify-center p-4">
    <div class="panel p-8 rounded-2xl w-full max-w-md" @click.away="showAddSantriModal = false">
        <h2 class="text-xl font-semibold mb-6">Tambah Santri Baru</h2>
        <div class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-slate-500">Nama Lengkap</label>
                <input type="text" x-model="newSantri.nama" class="w-full p-2.5 outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
                <label class="block text-sm mb-1 text-slate-500">Kelas</label>
                <input type="text" x-model="newSantri.kelas" class="w-full p-2.5 outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div>
                <label class="block text-sm mb-1 text-slate-500">WhatsApp Ortu (62xxx)</label>
                <input type="text" x-model="newSantri.kontak_ortu" class="w-full p-2.5 outline-none focus:ring-1 focus:ring-primary">
            </div>
            <div class="flex gap-4 mt-6">
                <button @click="showAddSantriModal = false" class="flex-1 btn-action btn-action-ghost">
                    <i data-lucide="x" class="w-4 h-4"></i>
                    <span>Batal</span>
                </button>
                <button type="button" @click="handleAddSantri" :disabled="loading" class="flex-1 btn-action btn-action-primary disabled:opacity-60 disabled:cursor-not-allowed">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Simpan</span>
                </button>
            </div>
        </div>
    </div>
</div>
