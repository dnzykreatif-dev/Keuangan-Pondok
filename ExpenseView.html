<div x-show="view === 'expenses'" class="animate-in space-y-6">
    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <div class="glass p-6 rounded-2xl">
            <h3 class="font-bold mb-5">Tambah Pengeluaran</h3>
            <div class="space-y-4">
                <input type="date" x-model="newExpense.date" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5">
                <select x-model="newExpense.category" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5">
                    <template x-for="cat in expenseCategories" :key="cat.category_id"><option :value="cat.name" x-text="cat.name"></option></template>
                </select>
                <input type="number" x-model="newExpense.amount" placeholder="Nominal" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5">
                <input type="text" x-model="newExpense.supplier" placeholder="Supplier / Penerima" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5">
                <select x-model="newExpense.method" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5"><option>Tunai</option><option>Transfer</option><option>QRIS</option></select>
                <select x-model="newExpense.project_id" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5">
                    <option value="">Tidak terkait proyek</option>
                    <template x-for="project in developmentProjects" :key="project.project_id"><option :value="project.project_id" x-text="project.name"></option></template>
                </select>
                <textarea x-model="newExpense.description" placeholder="Keterangan" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg p-2.5"></textarea>
                <input type="file" @change="handleFileUpload($event, newExpense)" class="block w-full text-sm text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-primary/10 file:text-primary">
                <button @click="handleAddExpense" class="w-full bg-primary py-3 rounded-lg font-semibold">Simpan Pengeluaran</button>
            </div>
        </div>
        <div class="xl:col-span-2 glass rounded-2xl overflow-hidden">
            <div class="p-5 border-b border-zinc-800"><h3 class="font-bold">Riwayat Pengeluaran</h3></div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-zinc-900/50 text-zinc-400 text-xs uppercase"><tr><th class="p-4">Tanggal</th><th class="p-4">Kategori</th><th class="p-4">Supplier</th><th class="p-4 text-right">Nominal</th><th class="p-4">Metode</th></tr></thead>
                    <tbody class="divide-y divide-zinc-800">
                        <template x-for="expense in expenseList" :key="expense.expense_id">
                            <tr><td class="p-4" x-text="formatDate(expense.date)"></td><td class="p-4 font-semibold" x-text="expense.category"></td><td class="p-4" x-text="expense.supplier || '-'"></td><td class="p-4 text-right text-danger" x-text="formatCurrency(expense.amount)"></td><td class="p-4" x-text="expense.method"></td></tr>
                        </template>
                        <tr x-show="expenseList.length === 0"><td colspan="5" class="p-6 text-center text-sm text-zinc-500">Belum ada pengeluaran.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
