<div x-show="view === 'expenses'" class="animate-in page-accent accent-orange space-y-6">
    <div class="grid grid-cols-1 xl:grid-cols-3 gap-6">
        <div class="glass p-6 rounded-2xl">
            <div class="mb-5 flex items-center gap-3">
                <div class="w-11 h-11 rounded-2xl bg-warning/15 text-warning flex items-center justify-center">
                    <i data-lucide="receipt-text" class="w-5 h-5"></i>
                </div>
                <div>
                    <h3 class="font-semibold">Tambah Pengeluaran</h3>
                    <p class="text-xs text-zinc-500">Catat kas keluar pondok</p>
                </div>
            </div>
            <div class="space-y-4">
                <input type="date" x-model="newExpense.date" class="w-full p-2.5">
                <select x-model="newExpense.category" class="w-full p-2.5">
                    <template x-for="cat in expenseCategories" :key="cat.category_id"><option :value="cat.name" x-text="cat.name"></option></template>
                </select>
                <input type="number" x-model="newExpense.amount" placeholder="Nominal" class="w-full p-2.5">
                <input type="text" x-model="newExpense.supplier" placeholder="Supplier / Penerima" class="w-full p-2.5">
                <select x-model="newExpense.method" class="w-full p-2.5"><option>Tunai</option><option>Transfer</option><option>QRIS</option></select>
                <select x-model="newExpense.project_id" class="w-full p-2.5">
                    <option value="">Tidak terkait proyek</option>
                    <template x-for="project in developmentProjects" :key="project.project_id"><option :value="project.project_id" x-text="project.name"></option></template>
                </select>
                <textarea x-model="newExpense.description" placeholder="Keterangan" class="w-full p-2.5"></textarea>
                <input type="file" @change="handleFileUpload($event, newExpense)" class="block w-full text-sm text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-primary/10 file:text-primary">
                <button type="button" @click="handleAddExpense" :disabled="loading" class="w-full btn-action btn-action-danger disabled:opacity-60 disabled:cursor-not-allowed">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Simpan Pengeluaran</span>
                </button>
            </div>
        </div>
        <div class="xl:col-span-2 glass rounded-2xl overflow-hidden">
            <div class="p-5 border-b border-[#e6edf5] flex items-center justify-between"><h3 class="font-semibold">Riwayat Pengeluaran</h3><span class="text-xs font-bold text-danger bg-danger/10 px-3 py-1 rounded-full" x-text="expenseList.length + ' transaksi'"></span></div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead><tr><th class="p-4">Tanggal</th><th class="p-4">Kategori</th><th class="p-4">Supplier</th><th class="p-4 text-right">Nominal</th><th class="p-4">Metode</th><th class="p-4">Aksi</th></tr></thead>
                    <tbody class="divide-y divide-[#e6edf5]">
                        <template x-for="expense in expenseList" :key="expense.expense_id">
                            <tr><td class="p-4" x-text="formatDate(expense.date)"></td><td class="p-4 font-semibold" x-text="expense.category"></td><td class="p-4" x-text="expense.supplier || '-'"></td><td class="p-4 text-right text-danger font-bold" x-text="formatCurrency(expense.amount)"></td><td class="p-4"><span class="bg-warning/15 text-warning px-2.5 py-1 rounded-full text-xs font-bold" x-text="expense.method"></span></td><td class="p-4"><button @click="editExpenseData(expense)" class="mr-2">Edit</button><button @click="deleteExpenseData(expense)" class="text-danger">Hapus</button></td></tr>
                        </template>
                        <tr x-show="expenseList.length === 0"><td colspan="6" class="p-6 text-center text-sm text-zinc-500">Belum ada pengeluaran.</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
