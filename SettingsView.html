<div x-show="view === 'settings'" class="animate-in">
    <div class="max-w-2xl space-y-6">
        <div class="glass p-8 rounded-3xl">
            <h3 class="text-xl font-semibold mb-6 flex items-center gap-2"><i data-lucide="school" class="w-5 h-5 text-primary"></i>Profil Pesantren</h3>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-500 mb-2">Nama Pesantren</label>
                    <div class="flex gap-2">
                        <input type="text" x-model="settings.school_name" class="flex-1 px-4 py-2.5 outline-none focus:border-primary">
                        <button @click="saveSetting('school_name', settings.school_name)" class="bg-primary text-white px-4 py-2 rounded-xl text-sm font-semibold">Simpan</button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-500 mb-2">Logo Sekolah</label>
                    <div class="flex items-center gap-6 p-4 bg-[#f5f8fc] border border-dashed border-[#dbe5ef] rounded-2xl">
                        <div class="w-20 h-20 bg-white rounded-xl flex items-center justify-center overflow-hidden border border-[#dbe5ef]">
                            <template x-if="settings.logo_url"><img :src="settings.logo_url" class="w-full h-full object-contain"></template>
                            <template x-if="!settings.logo_url"><i data-lucide="image" class="w-8 h-8 text-slate-400"></i></template>
                        </div>
                        <div class="flex-1">
                            <input type="file" @change="handleLogoUpload" class="block w-full text-sm text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-primary/10 file:text-primary hover:file:bg-primary/20 cursor-pointer">
                        </div>
                    </div>
                </div>
                <div class="p-4 bg-[#f5f8fc] border border-[#dbe5ef] rounded-2xl">
                    <p class="text-sm text-zinc-400">Level 1 menampilkan operasional pondok. Jurnal dan laporan akuntansi tetap tersedia di `Mode Akuntansi` untuk Admin.</p>
                </div>
            </div>
        </div>
    </div>
</div>
